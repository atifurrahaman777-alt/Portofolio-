<!doctype html>
<html lang="id">
<head>
<script id="mz-guard">
(function(){
  var root = document.documentElement;
  root.style.visibility = 'hidden';
  var CFG = {apiKey:"AIzaSyArfUhdOVfyIsjKjfD_9BkbixxNa6XRvsM",authDomain:"manz-web.firebaseapp.com",projectId:"manz-web",appId:"1:178479215158:web:265819c21836b2116f5e97"};
  function lock(msg){
    document.body.innerHTML = '<div style="max-width:420px;margin:18vh auto;padding:24px;text-align:center;font-family:system-ui,sans-serif"><h2>Masuk dulu</h2><p>' + msg + '</p><a href="/" style="display:inline-block;margin-top:12px;padding:12px 20px;border-radius:10px;background:var(--ui-surface-2);color:var(--ui-text);text-decoration:none;font-weight:500">Ke beranda</a></div>';
    root.style.visibility = 'visible';
  }
  function load(src, cb){
    var sc = document.createElement('script');
    sc.src = src; sc.onload = cb;
    sc.onerror = function(){ lock('Gagal memeriksa login. Muat ulang halaman.'); };
    document.head.appendChild(sc);
  }
  function run(){
    try { if (!firebase.apps.length) firebase.initializeApp(CFG); } catch (e) {}
    firebase.auth().onAuthStateChanged(function(u){
      if (u) root.style.visibility = 'visible';
      else lock('Fitur ini hanya untuk pengguna yang sudah login. Tamu hanya bisa memakai Game dan Musik.');
    });
  }
  function go(){
    if (window.firebase && firebase.auth) { run(); return; }
    load('https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js', function(){
      load('https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js', run);
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', go); else go();
  setTimeout(function(){ if (root.style.visibility === 'hidden') lock('Pemeriksaan login terlalu lama. Muat ulang halaman.'); }, 12000);
})();
</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<title>Chat Global</title>
<link rel="manifest" href="/manifest.json?v=22"><meta name="theme-color" content="#0d1117"><link rel="apple-touch-icon" href="/icon-192.png?v=22">

<style id="mz-state-contract">
:is(a,button,input,select,textarea,[role="button"]):focus-visible{outline:2px solid var(--ui-accent);outline-offset:2px}
button:hover,a:hover{background:var(--ui-raised)}
button:active,a:active{transform:none}
button:disabled,input:disabled,select:disabled,textarea:disabled{opacity:.5;cursor:not-allowed}
</style>
</head>
<body>
<script>
try { if (localStorage.getItem('chat_light') === '1') document.body.classList.add('light-mode'); } catch (e) {}
</script>
<div class="gc" id="gc">
  <div class="gc-head">
    <button type="button" class="gc-ib" id="gc-users" aria-label="Anggota"></button>
    <button type="button" class="gc-ib" id="gc-back" aria-label="Kembali"></button>
    <div class="gc-title"><b>Chat Global</b><span><i class="gc-dot"></i><span id="gc-online">1 online</span></span></div>
    <button type="button" class="gc-ib" id="gc-bell" aria-label="Suara"></button>
    <button type="button" class="gc-ib" id="gc-theme" aria-label="Tema"></button>
    <div id="gc-me"></div>
  </div>
  <div id="gc-top">
    <div class="gc-strip" id="gc-stories"></div>
    <div class="gc-strip gc-notes" id="gc-notes"></div>
  </div>
  <div class="gc-list" id="gc-list"></div>
  <div class="gc-replybar" id="gc-replybar">
    <div><b id="gc-rname"></b><span id="gc-rtext"></span></div>
    <button type="button" id="gc-rx" aria-label="Batal">✕</button>
  </div>
  <div class="gc-emoji" id="gc-emoji"></div>
  <div id="gc-status"></div>
  <div class="gc-bar">
    <button type="button" class="gc-ib" id="gc-eye" aria-label="Sembunyikan story"></button>
    <button type="button" class="gc-ib" id="gc-eraser" aria-label="Bersihkan"></button>
    <button type="button" class="gc-ib" id="gc-sticker" aria-label="Emoji"></button>
    <input id="gc-input" type="text" maxlength="300" placeholder="Tulis pesan" autocomplete="off" aria-label="Tulis pesan">
    <button type="button" class="gc-act" id="gc-action" aria-label="Kirim"></button>
  </div>
</div>
<div id="gc-overlay" hidden></div>

<script id="mz-theme-authority">
(function(){
  var KEY='mz_settings';
  function id(){
    try{return JSON.parse(localStorage.getItem(KEY)||'{}').theme||'mono';}catch(e){return 'mono';}
  }
  window.mzApplyTheme=function(){
    var t=id(), h=document.documentElement, b=document.body, mode;
    if(t==='mono')h.removeAttribute('data-mz-accent');
    else h.setAttribute('data-mz-accent',t);
    if(b){
      try{mode=localStorage.getItem('mz-theme');}catch(e){}
      b.classList.toggle('light-mode',mode!=='dark');
    }
    return t;
  };
  window.mzApplyTheme();
  document.addEventListener('DOMContentLoaded',window.mzApplyTheme);
})();
</script>
</body>
</html>
