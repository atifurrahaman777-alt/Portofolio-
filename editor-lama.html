<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<title>Code Editor | Mann'zz Tools</title>
<link rel="icon" type="image/png" href="icon-192.png?v=17">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">

<style id="mz-design-system">
/* ==========================================================================
   SIGNAL GRID — sistem desain baru
   Satu berkas, satu sumber kebenaran. Tanpa lapisan tambahan.
   ========================================================================== */

/* --- 1. Token ----------------------------------------------------------- */
:root {
  color-scheme: light;
  --ui-canvas:#f4f1e6; --ui-surface:#fffdf5; --ui-surface-2:#eae6d6;
  --ui-ink:#141414; --ui-text:#141414; --ui-text-muted:#5c584c;
  --ui-border:#141414; --ui-accent:#ff5c35; --ui-accent-bg:#ff5c35;
  --ui-on-accent:#141414; --ui-success:#16845b; --ui-success-text:#0f6b49;
  --ui-warning:#e0a400; --ui-warning-text:#7a5400; --ui-danger:#d53b36;
  --ui-danger-text:#a32722; --ui-info:#2c62c8;
  --ui-shadow:3px 3px 0 var(--ui-ink);
  --ui-overlay:rgba(20,20,20,.68);
  --ui-font-display:"Arial Black","Archivo Black",Arial,sans-serif;
  --ui-font-body:"Inter","Helvetica Neue",Arial,sans-serif;
  --ui-font-mono:ui-monospace,"SFMono-Regular",Consolas,monospace;

  --bg:var(--ui-canvas); --bg2:var(--ui-surface); --card:var(--ui-surface);
  --card-2:var(--ui-surface-2); --panel:var(--ui-surface); --inp:var(--ui-surface);
  --line:var(--ui-border); --text:var(--ui-text); --txt:var(--ui-text);
  --head:var(--ui-text); --muted:var(--ui-text-muted); --mut:var(--ui-text-muted);
  --accent:var(--ui-accent); --acc:var(--ui-accent);
  --brand:var(--ui-accent); --brand-hover:var(--ui-accent-bg);
  --gold:var(--ui-warning-text); --warn:var(--ui-warning-text);
  --err:var(--ui-danger-text); --purple:var(--ui-accent);
  --black:var(--ui-ink); --on:var(--ui-on-accent); --shadow:var(--ui-ink);
  --radius:0px; --code-strong:var(--ui-text); --code-mid:var(--ui-text);
  --code-dim:var(--ui-text-muted);
  --sh-card:var(--ui-surface); --sh-card-foreground:var(--ui-text);
  --sh-border:var(--ui-border); --sh-input:var(--ui-surface);
  --sh-primary:var(--ui-accent); --sh-ring:var(--ui-accent);
  --sp:var(--ui-accent); --sp-d:var(--ui-accent); --sp-ink:var(--ui-ink);
}
html[data-mz-accent="biru"],html[data-mz-accent="biru"] body {
  color-scheme:dark; --ui-canvas:#071a33; --ui-surface:#0f2c52;
  --ui-surface-2:#173d70; --ui-ink:#eaf3ff; --ui-text:#eaf3ff;
  --ui-text-muted:#b9d3f2; --ui-border:#eaf3ff; --ui-accent:#67d0ff;
  --ui-accent-bg:#67d0ff; --ui-on-accent:#071a33;
}
html[data-mz-accent="hijau"],html[data-mz-accent="hijau"] body {
  color-scheme:dark; --ui-canvas:#0a2316; --ui-surface:#123a24;
  --ui-surface-2:#1b5233; --ui-ink:#eaffef; --ui-text:#eaffef;
  --ui-text-muted:#b6e6c4; --ui-border:#eaffef; --ui-accent:#b7f26b;
  --ui-accent-bg:#b7f26b; --ui-on-accent:#0a2316;
}
html[data-mz-accent="kuning"],html[data-mz-accent="kuning"] body {
  color-scheme:light; --ui-canvas:#fff3bf; --ui-surface:#ffe08a;
  --ui-surface-2:#ffd166; --ui-ink:#1a1300; --ui-text:#1a1300;
  --ui-text-muted:#5c4700; --ui-border:#1a1300; --ui-accent:#ff5c35;
  --ui-accent-bg:#ff5c35; --ui-on-accent:#1a1300;
}
html[data-mz-accent="pink"],html[data-mz-accent="pink"] body {
  color-scheme:dark; --ui-canvas:#2a0b20; --ui-surface:#491438;
  --ui-surface-2:#65204e; --ui-ink:#ffe9f7; --ui-text:#ffe9f7;
  --ui-text-muted:#e7b9da; --ui-border:#ffe9f7; --ui-accent:#ff8ac4;
  --ui-accent-bg:#ff8ac4; --ui-on-accent:#2a0b20;
}
html[data-mz-accent="oranye"],html[data-mz-accent="oranye"] body {
  color-scheme:dark; --ui-canvas:#2a1408; --ui-surface:#4a240d;
  --ui-surface-2:#66330f; --ui-ink:#fff0e2; --ui-text:#fff0e2;
  --ui-text-muted:#e9c3a4; --ui-border:#fff0e2; --ui-accent:#ffb020;
  --ui-accent-bg:#ffb020; --ui-on-accent:#2a1408;
}
.dark { color-scheme:dark; }

/* --- 2. Dasar ----------------------------------------------------------- */
*,*::before,*::after { box-sizing:border-box; }
html { scroll-behavior:smooth; }
body {
  margin:0; min-height:100vh; background:var(--ui-canvas); color:var(--ui-text);
  font:15px/1.6 var(--ui-font-body);
}
body.mz-lock,body.mz-sheetlock,body.mz-musiclock { overflow:hidden; }
html.mz-musiclock,html.mz-musiclock body { overflow:hidden; }
a { color:inherit; text-decoration:none; }
img { max-width:100%; display:block; }
button,input,select,textarea { font:inherit; color:inherit; }
button { cursor:pointer; }
button:disabled,input:disabled,select:disabled,textarea:disabled { opacity:.5; cursor:not-allowed; }
:is(a,button,input,select,textarea,[role="button"]):focus-visible {
  outline:3px solid var(--ui-accent); outline-offset:3px;
}
h1,h2,h3,h4 { font-family:var(--ui-font-display); font-weight:900;
  letter-spacing:-.04em; text-transform:uppercase; line-height:1.05; margin:0 0 12px; }
h1 { font-size:clamp(1.9rem,5vw,3.1rem); }
h2 { font-size:clamp(1.4rem,3.5vw,2.1rem); }
h3 { font-size:1.1rem; }
p { margin:0 0 12px; }
small { font-size:.78rem; }
[hidden] { display:none!important; }

/* --- 3. Permukaan & tombol --------------------------------------------- */
.wrap,.container { width:min(1100px,calc(100% - 32px)); margin:0 auto; padding:24px 0 64px; }
.grid { display:grid; gap:16px; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); }
.card,.panel,.about-card,.security-card,.email-card,.profile-card,.tool-card,
.project,.skill,.quote,.game-box,.dl-box,.rc-box,.tm-box,.amfind-result,
.email-section,.contact-block,.pf-info,.pf-sheet-panel {
  background:var(--ui-surface); color:var(--ui-text);
  border:2px solid var(--ui-ink); box-shadow:var(--ui-shadow); padding:18px;
}
.card,.panel { margin-bottom:16px; }
.eyebrow,.about-kicker,.email-kicker,.banner-tag {
  font:800 .72rem/1 var(--ui-font-mono); letter-spacing:.14em;
  text-transform:uppercase; color:var(--ui-text-muted);
}
.brand,.logo { font-family:var(--ui-font-display); font-weight:900;
  letter-spacing:-.04em; text-transform:uppercase; }
.accent { color:var(--ui-accent); }
.sub,.muted,.note,.foot-note,.pf-bio,.banner-sub {
  color:var(--ui-text-muted); font-size:.86rem;
}
.btn,.mzs-btn,.dl-mini,.gc-act,.gc-play,#run,.keys button,.seg button,.ftabs button,
.auth-tab,.ocean-tab,.dl-tab,.game-controls button,#theme-toggle,#auth-toggle {
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding:11px 16px; background:var(--ui-surface); color:var(--ui-text);
  border:2px solid var(--ui-ink); box-shadow:3px 3px 0 var(--ui-ink);
  font-weight:800; text-transform:uppercase; letter-spacing:-.01em;
}
.btn:hover,.mzs-btn:hover,.gc-act:hover,.gc-play:hover,#run:hover,
.keys button:hover,.seg button:hover,.ftabs button:hover,
.auth-tab:hover,.ocean-tab:hover,.dl-tab:hover,.game-controls button:hover {
  transform:translate(-1px,-1px); box-shadow:5px 5px 0 var(--ui-ink);
}
.btn:active,button:active { transform:translate(2px,2px); box-shadow:1px 1px 0 var(--ui-ink); }
.btn.primary,.btn.pri,.nav-btn.active,.btn.primary,.gc-act.rec,#mzPlay,
.mzs-tabs button.on,.ocean-tab.active,.dl-tab.active,.email-step.active,
.ocean-tab.active,.game-controls button.active,.mzs-chips button.on,
.keys button.on,.seg button.on,.ftabs button.on,#run,.gc-play {
  background:var(--ui-accent); color:var(--ui-on-accent);
}
.btn.ghost,.ghost { background:transparent; }
input,select,textarea,.input-field,.dl-paste {
  width:100%; padding:12px; background:var(--ui-surface); color:var(--ui-text);
  border:2px solid var(--ui-ink); box-shadow:3px 3px 0 var(--ui-ink);
  border-radius:0;
}
input:focus,textarea:focus,select:focus { outline:3px solid var(--ui-accent); outline-offset:2px; }
.pill,.tag,.platform-chip,.pf-chip,.owner-badge {
  display:inline-flex; align-items:center; gap:6px; padding:5px 11px;
  background:var(--ui-surface-2); color:var(--ui-text);
  border:2px solid var(--ui-ink); font:800 .72rem/1.4 var(--ui-font-mono);
  text-transform:uppercase;
}
.spinner { width:22px; height:22px; border:3px solid var(--ui-surface-2);
  border-top-color:var(--ui-accent); border-radius:50%; animation:sgSpin .8s linear infinite; }
@keyframes sgSpin { to { transform:rotate(360deg); } }
.is-loading { opacity:.55; pointer-events:none; }

/* --- 4. Header, sidebar, navigasi -------------------------------------- */
header { position:sticky; top:0; z-index:30; background:var(--ui-surface);
  border-bottom:3px solid var(--ui-ink); }
.topbar { display:flex; align-items:center; justify-content:space-between;
  gap:12px; min-height:64px; width:min(1200px,calc(100% - 32px)); margin:0 auto; }
.topbar-actions,.auth-prov,.pf-actions { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
body.mz-scrolled header { box-shadow:0 4px 0 var(--ui-ink); }
.verified-badge,.verified-badge2 { display:inline-flex; color:var(--ui-success-text); vertical-align:middle; }
.verified-badge .badge-icon { width:18px; height:18px; }
.verified-badge2 .badge-icon { width:16px; height:16px; }
.owner-role { color:var(--ui-accent); }
.owner-panel { background:var(--ui-surface-2); border-bottom:2px solid var(--ui-ink); padding:14px 16px; }
.auth-form { max-width:420px; margin:0 auto; padding:20px; background:var(--ui-surface);
  border:2px solid var(--ui-ink); box-shadow:var(--ui-shadow); }
.auth-tabs,.mzs-tabs,.ocean-nav,.pf-tabs,.ftabs,.dl-tabs { display:flex; gap:6px;
  border-bottom:2px solid var(--ui-ink); margin-bottom:14px; overflow-x:auto; }
.auth-tabs button,.mzs-tabs button,.ocean-nav button,.pf-tabs button,.ftabs button,.dl-tabs button {
  flex:1; padding:10px; background:transparent; border:0; border-bottom:3px solid transparent;
  font-weight:900; text-transform:uppercase; color:var(--ui-text-muted);
}
.auth-tabs button.active,.mzs-tabs button.on,.ocean-nav button.active,
.pf-tabs button.on,.ftabs button.on,.dl-tabs button.active {
  color:var(--ui-accent); border-bottom-color:var(--ui-accent); }
.pass-wrap { position:relative; }
.pass-eye { position:absolute; right:10px; top:50%; transform:translateY(-50%);
  background:none; border:0; cursor:pointer; }
.gate-error,.dl-error,.rc-error,.tm-error { color:var(--ui-danger-text); font-weight:700; }

.sidebar-overlay { position:fixed; inset:0; z-index:80; background:var(--ui-overlay); display:none; }
.sidebar-overlay.active { display:block; }
.sidebar { position:fixed; left:0; top:0; bottom:0; z-index:90; width:min(320px,86vw);
  background:var(--ui-surface); border-right:3px solid var(--ui-ink);
  transform:translateX(-105%); transition:transform .2s ease; display:flex; flex-direction:column; }
.sidebar.active { transform:none; }
.sidebar-head { display:flex; align-items:center; justify-content:space-between;
  padding:16px; border-bottom:3px solid var(--ui-ink); }
.sidebar-nav { display:flex; flex-direction:column; gap:8px; padding:12px; overflow-y:auto; flex:1; }
.nav-btn { display:flex; align-items:center; gap:10px; width:100%; padding:12px;
  background:var(--ui-surface); border:2px solid var(--ui-ink); box-shadow:3px 3px 0 var(--ui-ink);
  font-weight:900; text-transform:uppercase; text-align:left; }
.nav-btn.home { display:none; }
.nav-btn .icon,.icon { width:20px; height:20px; stroke:currentColor; flex:none; }
.sidebar-foot { padding:12px; border-top:3px solid var(--ui-ink); }
.mz-sidelinks { display:flex; gap:8px; }
.mz-sl { flex:1; display:flex; align-items:center; justify-content:center; gap:6px;
  padding:10px 6px; border:2px solid var(--ui-ink); background:var(--ui-surface);
  font-weight:800; font-size:.75rem; text-transform:uppercase; }
.mz-sl svg { width:18px; height:18px; }
.mz-lang { display:flex; align-items:center; gap:8px; margin:10px 0; }
.mz-lang select { padding:9px; }

.bottom-nav { display:flex; justify-content:space-around; gap:4px; position:fixed;
  left:0; right:0; bottom:0; z-index:60; padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));
  background:var(--ui-surface); border-top:3px solid var(--ui-ink); }
.bottom-nav .nav-btn { width:auto; flex:1; flex-direction:column; gap:2px; padding:8px 4px;
  font-size:.68rem; text-align:center; }
.bottom-nav .nav-btn.home { display:flex; margin-top:-26px; border-radius:50%;
  width:52px; height:52px; flex:none; align-items:center; justify-content:center;
  background:var(--ui-accent); color:var(--ui-on-accent); }
.bottom-nav .nav-btn.home span { width:36px; height:36px; display:flex; align-items:center; justify-content:center; }
footer { text-align:center; color:var(--ui-text-muted); padding:24px 16px;
  border-top:3px solid var(--ui-ink); font:800 .72rem var(--ui-font-mono);
  text-transform:uppercase; letter-spacing:.1em; }

/* --- 5. Konten beranda -------------------------------------------------- */
.app { padding:18px 16px 90px; }
.tab { display:none; }
.tab.active { display:block; animation:sgIn .28s ease; }
@keyframes sgIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
.hero { border-left:6px solid var(--ui-accent); }
.banner { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:16px; }
.banner-title { font-family:var(--ui-font-display); font-weight:900; text-transform:uppercase; }
.banner-icon { width:44px; height:44px; display:flex; align-items:center; justify-content:center;
  background:var(--ui-accent); color:var(--ui-on-accent); border:2px solid var(--ui-ink); }
.profile-top { display:flex; gap:14px; align-items:center; }
.avatar,.pf-av { width:64px; height:64px; flex:none; display:flex; align-items:center;
  justify-content:center; background:var(--ui-accent); color:var(--ui-on-accent);
  border:2px solid var(--ui-ink); box-shadow:3px 3px 0 var(--ui-ink); overflow:hidden; }
.avatar img,.pf-av img { width:100%; height:100%; object-fit:cover; }
.profile-name { font-family:var(--ui-font-display); font-weight:900;
  text-transform:uppercase; letter-spacing:-.04em; }
.profile-name>span:first-child { color:var(--ui-accent); }
.stat-row,.pf-stats,.pf-bd-grid,.pf-sw-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:16px; }
.stat { padding:12px 6px; text-align:center; background:var(--ui-surface-2);
  border:2px solid var(--ui-ink); }
.stat b { display:block; font-family:var(--ui-font-display); font-size:1.4rem; }
.stat span { font:800 .68rem var(--ui-font-mono); text-transform:uppercase; color:var(--ui-text-muted); }
.skills { display:flex; flex-wrap:wrap; gap:8px; }
.skill { padding:8px 12px; }
.projects { display:grid; gap:16px; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); }
.project-links a { display:inline-flex; margin-right:8px; padding:7px 12px;
  border:2px solid var(--ui-ink); background:var(--ui-surface-2);
  font-weight:800; font-size:.76rem; text-transform:uppercase; }
.tool-icon { width:46px; height:46px; display:flex; align-items:center; justify-content:center;
  background:var(--ui-accent); color:var(--ui-on-accent); border:2px solid var(--ui-ink); flex:none; }
.about-block { border-top:3px solid var(--ui-ink); padding-top:16px; margin-top:16px; }
.icon-inline { display:inline-flex; vertical-align:middle; }
.badge-icon { width:18px; height:18px; }

/* Avatar badge — satu aturan untuk semua varian. */
[class*="bd-a-"] { position:relative; isolation:isolate; }
[class*="bd-a-"]::before,[class*="bd-a-"]::after { position:absolute; z-index:2;
  line-height:1; pointer-events:none; font-size:calc(var(--sz,40px) * .5); }
.bd-a-bunga::before { content:'✿'; top:-16%; right:-16%; color:var(--ui-accent); }
.bd-a-bintang::before { content:'★'; top:-16%; right:-16%; color:var(--ui-warning-text); }
.bd-a-hati::before { content:'♥'; top:-16%; right:-16%; color:var(--ui-danger-text); }
.bd-a-pita::before { content:'◆'; top:-18%; left:-16%; color:var(--ui-accent); }
.bd-a-mahkota::before { content:'♛'; top:-42%; left:50%; transform:translateX(-50%); color:var(--ui-warning-text); }
.bd-a-api::before { content:'▲'; top:-32%; left:50%; transform:translateX(-50%); color:var(--ui-accent); }
.bd-a-kilat::before { content:'⚡'; top:-16%; right:-16%; }
.bd-a-kucing::before,.bd-a-kucing::after { content:''; width:32%; height:32%;
  background:var(--ui-accent); clip-path:polygon(0 100%,50% 0,100% 100%); z-index:-1; }
.bd-a-kucing::before { top:-14%; left:4%; }
.bd-a-kucing::after { top:-14%; right:4%; }
.bd-a-tanduk::before,.bd-a-tanduk::after { content:''; width:26%; height:30%;
  background:var(--ui-danger); clip-path:polygon(0 100%,50% 0,100% 100%); z-index:-1; }
.bd-a-tanduk::before { top:-20%; left:6%; transform:rotate(-24deg); }
.bd-a-tanduk::after { top:-20%; right:6%; transform:rotate(24deg); }
.bd-a-halo::before { content:''; left:14%; right:14%; top:-26%; height:14%;
  border:3px solid var(--ui-warning); border-radius:50%; }
.bd-dot { width:38px; height:38px; --sz:38px; }

/* Panel editor profil / sheet. */
.pf-sheet-panel { position:fixed; inset:0; z-index:100; overflow:auto; padding:20px; }
.pf-sheet-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
.pf-sheet-row,.pf-form-row,.pf-row { display:flex; gap:10px; align-items:center; margin-bottom:12px; flex-wrap:wrap; }
.pf-form-row>*,.pf-row>* { flex:1; min-width:140px; }
.pf-banner { padding:16px; border:2px solid var(--ui-ink); background:var(--ui-surface-2); }
.pf-prog,.pf-bar,.pf-up { height:10px; background:var(--ui-surface-2); border:2px solid var(--ui-ink); }
.pf-prog i,.pf-bar i,.pf-up i { display:block; height:100%; background:var(--ui-accent); }
.pf-fav-note,.pf-hint,.pf-shint { color:var(--ui-text-muted); font-size:.8rem; }
.pf-cam,.pf-camfix { position:relative; }

/* --- 6. Musik ----------------------------------------------------------- */
.mz-hasmini { padding-bottom:92px; }
.mzm { position:fixed; left:12px; right:12px; bottom:calc(12px + env(safe-area-inset-bottom,0px));
  z-index:70; max-width:520px; margin:0 auto; display:flex; align-items:center; gap:8px;
  padding:10px; background:var(--ui-surface); color:var(--ui-text);
  border:2px solid var(--ui-ink); box-shadow:var(--ui-shadow); }
.mzm[hidden] { display:none; }
.mzm-bar { position:absolute; left:0; right:0; top:0; height:4px; background:var(--ui-surface-2); }
.mzm-bar i { display:block; height:100%; width:0; background:var(--sp); }
.mzm-main { flex:1; min-width:0; display:flex; align-items:center; gap:10px;
  background:none; border:0; padding:0; text-align:left; }
.mzm-main img,.mzm-ph { width:40px; height:40px; object-fit:cover; flex:none;
  background:var(--ui-surface-2); border:2px solid var(--ui-ink); }
.mzm-t { min-width:0; display:flex; flex-direction:column; }
.mzm-t b,.mzs-it b { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:.9rem; }
.mzm-t small,.mzs-it small { color:var(--ui-text-muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.mzm-b { width:38px; height:38px; flex:none; display:flex; align-items:center; justify-content:center;
  background:transparent; border:0; padding:0; }
.mzm-b svg { width:20px; height:20px; }
#mzPlay { background:var(--sp); color:var(--sp-ink); border:2px solid var(--ui-ink); }
.mzs { position:fixed; inset:0; z-index:95; display:flex; align-items:stretch;
  justify-content:center; background:var(--ui-overlay); overscroll-behavior:contain; }
.mzs.mz-off { visibility:hidden; pointer-events:none; opacity:0; }
.mzs-panel { width:100%; max-width:none; height:100%; display:flex; flex-direction:column;
  padding:16px 16px calc(24px + env(safe-area-inset-bottom,0px)); overflow:hidden;
  background:var(--ui-surface); color:var(--ui-text); border:0; }
.mzs-panel>* { flex:none; }
.mz-scroll { flex:1 1 auto!important; overflow-y:auto; }
.mzs-head { position:sticky; top:-16px; z-index:2; display:flex; justify-content:space-between;
  align-items:center; padding:8px 0 12px; background:var(--ui-surface); margin-bottom:10px; }
.mzs-head-title { display:inline-flex; align-items:center; gap:8px; }
.mzs-head button { background:none; border:0; font-weight:800; }

var UNSLOP_IFRAME_TOKENS = ':root{--ui-canvas:#08090a;--ui-surface:#0f1011;--ui-surface-2:#161719;--ui-ink:#08090a;--ui-on-accent:#08090a;--ui-text:#f7f8f8;--ui-text-muted:#b0b5c0;--ui-border:rgba(255,255,255,.14);--ui-accent:#a5aaff;--ui-accent-bg:#a5aaff;--ui-success:#4cb782;--ui-success-text:#55d39a;--ui-warning:#d7a642;--ui-danger:#ff8a8a;--ui-danger-text:#ff8a8a;--ui-info:#93c5fd;--bg:var(--ui-canvas);--card:var(--ui-surface-2);--line:var(--ui-border);--text:var(--ui-text);--txt:var(--ui-text);--muted:var(--ui-text-muted);--mut:var(--ui-text-muted);--on:var(--ui-on-accent);--accent:var(--ui-accent);--gold:var(--ui-warning);--err:var(--ui-danger)}';
  var stampN = 0;
  function build(c){
    return '<!doctype html><html><head><!--' + Date.now() + '-' + (++stampN) + '--><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">' + BRIDGE +
      '<style>' + UNSLOP_IFRAME_TOKENS + c.css + '</style></head><body>' + c.html + '<script>' + safeJs(c.js) + '<\/script></body></html>';
  }
  function exportDoc(c){
    return '<!doctype html>\n<html lang="id">\n<head>\n<meta charset="UTF-8">\n<meta name="viewport" content="width=device-width,initial-scale=1">\n<title>Proyek</title>\n<style>\n' +
      UNSLOP_IFRAME_TOKENS + '\n' + c.css + '\n</style>\n</head>\n<body>\n' + c.html + '\n<script>\n' + safeJs(c.js) + '\n<\/script>\n</body>\n</html>\n';
  }
  var frame = $('frame');
  function addLog(t, m){
    var box = $('con');
    var l = document.createElement('div');
    l.className = 'ln ' + t;
    l.textContent = m;
    box.appendChild(l);
    while (box.children.length > 200) box.removeChild(box.firstChild);
    box.scrollTop = box.scrollHeight;
  }
  window.addEventListener('message', function(e){
    if (e.source !== frame.contentWindow) return;
    var d = e.data;
    if (!d || d.mzc !== 1) return;
    addLog(String(d.t), String(d.m).slice(0, 2000));
  });
  $('conClear').addEventListener('click', function(){ $('con').textContent = ''; });
  function render(force){
    var c = getCode(), key = JSON.stringify(c);
    if (!force && !dirty) return; // kode belum berubah: jangan muat ulang pratinjau
    if (!force && key === lastCode) { dirty = false; return; }
    lastCode = key;
    dirty = false;
    $('con').textContent = '';
    frame.srcdoc = build(c);
  }
  function view(v, force){
    ['kode', 'hasil'].forEach(function(x){ $('v-' + x).classList.toggle('on', x === v); });
    $('seg').querySelectorAll('[data-v]').forEach(function(b){ b.classList.toggle('on', b.dataset.v === v); });
    if (v === 'hasil') render(force); else cm.refresh();
  }
  $('seg').querySelectorAll('[data-v]').forEach(function(b){ b.addEventListener('click', function(){ view(b.dataset.v); }); });
  $('run').addEventListener('click', function(){ view('hasil', true); });

  /* ----- Panel bawah ----- */
  function closeSheet(){ $('sheet').classList.add('off'); }
  $('sheet').addEventListener('click', function(e){ if (e.target === this) closeSheet(); });
  function openSheet(title, fill){
    var p = $('panel');
    p.textContent = '';
    var h = document.createElement('div');
    h.className = 'ph';
    var b = document.createElement('b');
    b.textContent = title;
    var x = document.createElement('button');
    x.type = 'button';
    x.textContent = 'Tutup';
    x.addEventListener('click', closeSheet);
    h.append(b, x);
    p.appendChild(h);
    fill(p);
    $('sheet').classList.remove('off');
  }
  function armed(btn, hint, fn){
    var orig = btn.textContent, on = false, t = 0;
    function off(){ on = false; btn.textContent = orig; btn.classList.remove('warn'); }
    btn.addEventListener('click', function(){
      if (!on) { on = true; btn.textContent = hint; btn.classList.add('warn'); t = setTimeout(off, 3000); return; }
      clearTimeout(t);
      off();
      fn();
    });
  }
  function loadCode(c){
    docs.html.setValue(c.html || '');
    docs.css.setValue(c.css || '');
    docs.js.setValue(c.js || '');
    docs.html.clearHistory();
    docs.css.clearHistory();
    docs.js.clearHistory();
    setFile('html');
    ls.set(K.d, JSON.stringify(getCode()));
  }
  function projects(){
    try { var a = JSON.parse(ls.get(K.p) || '[]'); return Array.isArray(a) ? a : []; } catch (e) { return []; }
  }
  function openProjects(){
    openSheet('Proyek tersimpan', function(p){
      var name = document.createElement('input');
      name.className = 'in';
      name.maxLength = 40;
      name.placeholder = 'Nama proyek';
      name.value = 'Proyek ' + (projects().length + 1);
      var save = document.createElement('button');
      save.type = 'button';
      save.className = 'btn pri';
      save.textContent = 'Simpan kode saat ini';
      save.addEventListener('click', function(){
        var n = name.value.trim().slice(0, 40) || 'Tanpa nama';
        var c = getCode();
        var all = projects();
        all.unshift({ id: Date.now().toString(36), name: n, ts: Date.now(), html: c.html, css: c.css, js: c.js });
        all = all.slice(0, 20);
        if (!ls.set(K.p, JSON.stringify(all))) { msg('Penyimpanan penuh atau diblokir browser.'); return; }
        msg('Proyek disimpan.');
        openProjects();
      });
      p.append(name, save);
      var list = projects();
      if (!list.length) {
        var empty = document.createElement('div');
        empty.className = 'row';
        empty.textContent = 'Belum ada proyek tersimpan.';
        p.appendChild(empty);
      }
      list.forEach(function(it){
        var row = document.createElement('div');
        row.className = 'row';
        var t = document.createElement('div');
        t.className = 't';
        var b = document.createElement('b');
        b.textContent = it.name;
        var s = document.createElement('small');
        s.textContent = new Date(it.ts).toLocaleString('id-ID', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
        t.append(b, s);
        var op = document.createElement('button');
        op.type = 'button';
        op.className = 'btn';
        op.textContent = 'Buka';
        armed(op, 'Ganti kode?', function(){ loadCode(it); closeSheet(); msg('Proyek dibuka.'); });
        var del = document.createElement('button');
        del.type = 'button';
        del.className = 'btn';
        del.textContent = 'Hapus';
        armed(del, 'Yakin?', function(){
          ls.set(K.p, JSON.stringify(projects().filter(function(x){ return x.id !== it.id; })));
          openProjects();
        });
        row.append(t, op, del);
        p.appendChild(row);
      });
    });
  }
  function openSamples(){
    openSheet('Contoh kode', function(p){
      SAMPLES.forEach(function(sm){
        var row = document.createElement('div');
        row.className = 'row';
        var t = document.createElement('div');
        t.className = 't';
        var b = document.createElement('b');
        b.textContent = sm.n;
        var s = document.createElement('small');
        s.textContent = sm.d;
        t.append(b, s);
        var use = document.createElement('button');
        use.type = 'button';
        use.className = 'btn';
        use.textContent = 'Pakai';
        armed(use, 'Ganti kode?', function(){ loadCode(sm); closeSheet(); msg('Contoh dimuat.'); });
        row.append(t, use);
        p.appendChild(row);
      });
    });
  }

  /* ----- Unduh, salin, reset ----- */
  function download(){
    var url = URL.createObjectURL(new Blob([exportDoc(getCode())], { type: 'text/html' }));
    var a = document.createElement('a');
    a.href = url;
    a.download = 'proyek.html';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 3000);
    msg('Mengunduh proyek.html...');
  }
  function copyAll(){
    var text = exportDoc(getCode());
    function fb(){
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) {}
      ta.remove();
      msg(ok ? 'Kode disalin.' : 'Gagal menyalin.');
    }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function(){ msg('Kode disalin.'); }, fb);
    else fb();
  }
  armed($('tools').querySelector('[data-a="reset"]'), 'Yakin hapus semua?', function(){ loadCode({ html: '', css: '', js: '' }); msg('Kode dikosongkan.'); });
  $('tools').querySelectorAll('[data-a]').forEach(function(b){
    var a = b.dataset.a;
    if (a === 'reset') return;
    b.addEventListener('click', function(){
      if (a === 'proyek') openProjects();
      else if (a === 'contoh') openSamples();
      else if (a === 'unduh') download();
      else if (a === 'salin') copyAll();
    });
  });
})();
</script>

<script id="mz-theme-authority">
(function(){
  var P={"mono": {"canvas": "#f4f1e6", "surface": "#fffdf5", "surface2": "#eae6d6", "ink": "#141414", "text": "#141414", "muted": "#5c584c", "border": "#141414", "accent": "#ff5c35", "accentBg": "#ff5c35", "onAccent": "#141414", "info": "#2c62c8", "scheme": "light"}, "biru": {"canvas": "#071a33", "surface": "#0f2c52", "surface2": "#173d70", "ink": "#eaf3ff", "text": "#eaf3ff", "muted": "#b9d3f2", "border": "#eaf3ff", "accent": "#67d0ff", "accentBg": "#67d0ff", "onAccent": "#071a33", "info": "#67d0ff", "scheme": "dark"}, "hijau": {"canvas": "#0a2316", "surface": "#123a24", "surface2": "#1b5233", "ink": "#eaffef", "text": "#eaffef", "muted": "#b6e6c4", "border": "#eaffef", "accent": "#b7f26b", "accentBg": "#b7f26b", "onAccent": "#0a2316", "info": "#9be8ff", "scheme": "dark"}, "kuning": {"canvas": "#fff3bf", "surface": "#ffe08a", "surface2": "#ffd166", "ink": "#1a1300", "text": "#1a1300", "muted": "#5c4700", "border": "#1a1300", "accent": "#ff5c35", "accentBg": "#ff5c35", "onAccent": "#1a1300", "info": "#2c62c8", "scheme": "light"}, "pink": {"canvas": "#2a0b20", "surface": "#491438", "surface2": "#65204e", "ink": "#ffe9f7", "text": "#ffe9f7", "muted": "#e7b9da", "border": "#ffe9f7", "accent": "#ff8ac4", "accentBg": "#ff8ac4", "onAccent": "#2a0b20", "info": "#9fc4ff", "scheme": "dark"}, "oranye": {"canvas": "#2a1408", "surface": "#4a240d", "surface2": "#66330f", "ink": "#fff0e2", "text": "#fff0e2", "muted": "#e9c3a4", "border": "#fff0e2", "accent": "#ffb020", "accentBg": "#ffb020", "onAccent": "#2a1408", "info": "#9fc4ff", "scheme": "dark"}}, M={"canvas": "--ui-canvas", "surface": "--ui-surface", "surface2": "--ui-surface-2", "ink": "--ui-ink", "text": "--ui-text", "muted": "--ui-text-muted", "border": "--ui-border", "accent": "--ui-accent", "accentBg": "--ui-accent-bg", "onAccent": "--ui-on-accent", "info": "--ui-info"}, KEY='mz_settings';
  function id(){
    try{var s=JSON.parse(localStorage.getItem(KEY)||'{}');return s.theme||'mono';}catch(e){return 'mono';}
  }
  function paint(p,el){
    if(!el)return;
    for(var k in M)el.style.setProperty(M[k],p[k],'important');
    el.style.setProperty('--ui-shadow','3px 3px 0 '+p.ink,'important');
    el.style.setProperty('--ui-overlay','rgba(20,20,20,.68)','important');
    el.style.setProperty('color-scheme',p.scheme,'important');
  }
  window.mzApplyTheme=function(){
    var t=id(), p=P[t]||P.mono, h=document.documentElement;
    if(t==='mono')h.removeAttribute('data-mz-accent');else h.setAttribute('data-mz-accent',t);
    paint(p,h);paint(p,document.body);
    var m=document.querySelector('meta[name="theme-color"]');
    if(m)m.setAttribute('content',p.canvas);
    return t;
  };
  window.mzThemePalette=P;
  window.mzApplyTheme();
  document.addEventListener('DOMContentLoaded',function(){
    try{if(localStorage.getItem('mz-theme')!=='dark')document.body.classList.add('light-mode');}catch(e){}
    window.mzApplyTheme();
  });
})();
</script>
