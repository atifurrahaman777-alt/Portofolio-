<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<title>Code Editor | Mann'zz Tools</title>
<link rel="icon" type="image/png" href="icon-192.png?v=19">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="/pro.css?v=19">
</head>
<body>
<div class="top">
  <div class="seg" id="seg"><button type="button" class="on" data-v="kode">Kode</button><button type="button" data-v="hasil">Hasil</button></div>
  <button type="button" class="btn pri" id="run">&#9654; Jalankan</button>
</div>
<div id="v-kode" class="view on">
  <div class="ftabs" id="ftabs"><button type="button" class="on" data-f="html">HTML</button><button type="button" data-f="css">CSS</button><button type="button" data-f="js">JS</button><span class="sp"></span><button type="button" id="fm" aria-label="Perkecil huruf">A&minus;</button><button type="button" id="fp" aria-label="Perbesar huruf">A+</button></div>
  <div id="ed"></div>
  <div class="keys" id="keys"></div>
</div>
<div id="v-hasil" class="view">
  <iframe id="frame" sandbox="allow-scripts allow-modals allow-forms allow-popups" title="Hasil"></iframe>
  <div class="con"><div class="con-h"><b>Konsol</b><button type="button" id="conClear">Bersihkan</button></div><div id="con"></div></div>
</div>
<div class="tools" id="tools"><button type="button" class="btn" data-a="proyek">Proyek</button><button type="button" class="btn" data-a="contoh">Contoh</button><button type="button" class="btn" data-a="unduh">Unduh</button><button type="button" class="btn" data-a="salin">Salin</button><button type="button" class="btn" data-a="reset">Reset</button></div>
<p id="msg"></p>
<div class="sheet off" id="sheet"><div class="panel" id="panel"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/fold/xml-fold.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closetag.min.js"></script>
<script>
(function(){
  function sync(){
    try {
      var pb = window.parent !== window ? window.parent.document.body : null;
      if (pb) document.body.classList.toggle('light-mode', pb.classList.contains('light-mode'));
    } catch (e) {}
  }
  sync();
  window.addEventListener('load', sync);
  try { new MutationObserver(sync).observe(window.parent.document.body, { attributes: true, attributeFilter: ['class'] }); } catch (e) {}
})();
</script>
<script>
(function(){
  'use strict';
  var $ = function(id){ return document.getElementById(id); };
  var K = { d: 'mz_editor_draft', p: 'mz_editor_projects', f: 'mz_editor_fs' };
  var ls = {
    get: function(k){ try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: function(k, v){ try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }
  };
  var MODE = { html: 'htmlmixed', css: 'css', js: 'javascript' };

  var SAMPLES = [
    { n: 'Halo Dunia', d: 'Tombol yang mengubah judul',
      html: '<h1>Halo, Dunia!</h1>\n<p>Edit kode ini lalu tekan Jalankan.</p>\n<button id="btn">Klik aku</button>',
      css: 'body{font-family:system-ui,sans-serif;text-align:center;padding:40px;background:var(--ui-surface-2);color:var(--ui-info)}\nbutton{padding:12px 20px;border:0;border-radius:10px;background:var(--ui-info);font-weight:500;font-size:1rem}',
      js: 'document.getElementById("btn").addEventListener("click", function(){\n  console.log("Tombol diklik!");\n  document.querySelector("h1").textContent = "Berhasil!";\n});' },
    { n: 'Kartu CSS', d: 'Kartu gradasi dengan efek sentuh',
      html: '<div class="card">\n  <h2>Kartu Keren</h2>\n  <p>Sentuh atau arahkan kursor ke sini.</p>\n</div>',
      css: 'body{display:grid;place-items:center;height:100vh;margin:0;background:var(--ui-surface-2);font-family:system-ui,sans-serif}\n.card{width:240px;padding:24px;border-radius:20px;color:var(--ui-text);background:linear-gradient(135deg,var(--ui-warning),var(--ui-accent-bg),var(--ui-info));transition:transform .3s}\n.card:hover,.card:active{transform:rotate(-3deg) scale(1.05)}\nh2{margin:0 0 8px}',
      js: '' },
    { n: 'Stopwatch', d: 'Hitung waktu dengan JavaScript',
      html: '<div id="t" class="tabular-nums">0.0</div>\n<button id="go">Mulai</button>\n<button id="rs">Reset</button>',
      css: 'body{font-family:system-ui,sans-serif;text-align:center;padding-top:60px;background:var(--ui-surface-2);color:var(--ui-text)}\n#t{font-size:4rem;font-weight:500;margin-bottom:20px}\nbutton{padding:10px 18px;margin:4px;border:0;border-radius:10px;font-weight:500}',
      js: 'var timer = null, ms = 0;\nvar t = document.getElementById("t");\ndocument.getElementById("go").onclick = function(){\n  if (timer) { clearInterval(timer); timer = null; this.textContent = "Lanjut"; return; }\n  this.textContent = "Jeda";\n  timer = setInterval(function(){ ms += 100; t.textContent = (ms / 1000).toFixed(1); }, 100);\n};\ndocument.getElementById("rs").onclick = function(){\n  clearInterval(timer); timer = null; ms = 0; t.textContent = "0.0";\n  document.getElementById("go").textContent = "Mulai";\n  console.log("Direset");\n};' },
    { n: 'Daftar Tugas', d: 'Tambah dan hapus item',
      html: '<h2>Tugasku</h2>\n<input id="in" placeholder="Tulis tugas..." aria-label="Tulis tugas">\n<button id="add">Tambah</button>\n<ul id="ls"></ul>',
      css: 'body{font-family:system-ui,sans-serif;max-width:420px;margin:30px auto;padding:0 16px}\ninput{padding:10px;border:1px solid var(--ui-border);border-radius:8px}\nbutton{padding:10px 14px;border:0;border-radius:8px;background:var(--ui-success);color:var(--ui-on-accent);font-weight:500}\nli{margin:8px 0;cursor:pointer}',
      js: 'var ls = document.getElementById("ls");\ndocument.getElementById("add").onclick = function(){\n  var i = document.getElementById("in");\n  if (!i.value.trim()) return;\n  var li = document.createElement("li");\n  li.textContent = i.value;\n  li.onclick = function(){ li.remove(); console.log("Dihapus"); };\n  ls.appendChild(li);\n  i.value = "";\n};' }
  ];

  var init = null;
  try { init = JSON.parse(ls.get(K.d) || 'null'); } catch (e) {}
  if (!init || typeof init.html !== 'string') init = SAMPLES[0];
  var docs = {
    html: CodeMirror.Doc(init.html || '', MODE.html),
    css: CodeMirror.Doc(String(init.css || ''), MODE.css),
    js: CodeMirror.Doc(String(init.js || ''), MODE.js)
  };
  var cur = 'html';
  var cm = CodeMirror($('ed'), {
    value: docs.html, lineNumbers: true, lineWrapping: true, tabSize: 2, indentUnit: 2,
    indentWithTabs: false, autoCloseBrackets: true, autoCloseTags: true, matchBrackets: true,
    extraKeys: { Tab: function(c){ c.execCommand('insertSoftTab'); } }
  });

  var fs = parseInt(ls.get(K.f), 10) || 13;
  function setFs(n){
    fs = Math.max(11, Math.min(22, n));
    $('ed').style.setProperty('--fs', fs + 'px');
    ls.set(K.f, String(fs));
    cm.refresh();
  }
  setFs(fs);
  $('fm').addEventListener('click', function(){ setFs(fs - 1); });
  $('fp').addEventListener('click', function(){ setFs(fs + 1); });

  function getCode(){ return { html: docs.html.getValue(), css: docs.css.getValue(), js: docs.js.getValue() }; }
  var tm = 0, dirty = true, lastCode = '';
  cm.on('change', function(){
    dirty = true;
    clearTimeout(tm); tm = setTimeout(function(){ ls.set(K.d, JSON.stringify(getCode())); }, 500);
  });
  function flushDraft(){ clearTimeout(tm); tm = 0; ls.set(K.d, JSON.stringify(getCode())); }
  window.addEventListener('pagehide', flushDraft);
  window.addEventListener('beforeunload', flushDraft);

  function setFile(f){
    cur = f;
    cm.swapDoc(docs[f]);
    $('ftabs').querySelectorAll('[data-f]').forEach(function(b){ b.classList.toggle('on', b.dataset.f === f); });
    cm.refresh();
  }
  $('ftabs').querySelectorAll('[data-f]').forEach(function(b){ b.addEventListener('click', function(){ setFile(b.dataset.f); }); });

  var mt = 0;
  function msg(t){
    $('msg').textContent = t || '';
    clearTimeout(mt);
    if (t) mt = setTimeout(function(){ $('msg').textContent = ''; }, 2600);
  }

  /* ----- Tombol simbol ----- */
  [['\u21B6', 'undo'], ['\u21B7', 'redo'], ['\u21E5', 'tab'], '<', '>', '/', '{', '}', '(', ')', '[', ']', '"', "'", '=', ';', ':', '.', '#', '!', '&', '|', '$', '_', '-', '+', '*'].forEach(function(k){
    var b = document.createElement('button');
    b.type = 'button';
    var label = typeof k === 'string' ? k : k[0];
    b.textContent = label;
    b.addEventListener('mousedown', function(e){ e.preventDefault(); });
    b.addEventListener('click', function(){
      if (typeof k !== 'string') {
        if (k[1] === 'undo') cm.undo();
        else if (k[1] === 'redo') cm.redo();
        else cm.execCommand('insertSoftTab');
      } else cm.replaceSelection(k);
      cm.focus();
    });
    $('keys').appendChild(b);
  });

  /* ----- Hasil dan konsol ----- */
  var BRIDGE = '<script>(function(){function s(t,a){try{parent.postMessage({mzc:1,t:t,m:a.map(function(x){try{return typeof x==="object"?JSON.stringify(x):String(x)}catch(e){return String(x)}}).join(" ")},"*")}catch(e){}}["log","info","warn","error"].forEach(function(k){var o=console[k];console[k]=function(){s(k,[].slice.call(arguments));try{o.apply(console,arguments)}catch(e){}}});window.addEventListener("error",function(e){s("error",[e.message+(e.lineno?" (baris "+e.lineno+")":"")])});window.addEventListener("unhandledrejection",function(e){s("error",["Promise ditolak: "+(e.reason&&e.reason.message||e.reason)])})})();<\/script>';
  function safeJs(js){ return js.replace(/<\/script/gi, '<\\/script'); }
var UNSLOP_IFRAME_TOKENS = ':root{--ui-canvas:#08090a;--ui-surface:#0f1011;--ui-surface-2:#161719;--ui-ink:#08090a;--ui-on-accent:#08090a;--ui-text:#f7f8f8;--ui-text-muted:#b0b5c0;--ui-border:rgba(255,255,255,.14);--ui-accent:#a5aaff;--ui-accent-bg:#a5aaff;--ui-success:#4cb782;--ui-success-text:#55d39a;--ui-warning:#d7a642;--ui-danger:#ff8a8a;--ui-danger-text:#ff8a8a;--ui-info:#93c5fd;--bg:var(--ui-canvas);--card:var(--ui-surface-2);--line:var(--ui-border);--text:var(--ui-text);--txt:var(--ui-text);--muted:var(--ui-text-muted);--mut:var(--ui-text-muted);--on:var(--ui-on-accent);--accent:var(--ui-accent);--gold:var(--ui-warning);--err:var(--ui-danger)}';
  var stampN = 0;
  function build(c){
    return '<!doctype html><html><head><!--' + Date.now() + '-' + (++stampN) + '--><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">' + BRIDGE +
      '<style>' + UNSLOP_IFRAME_TOKENS + c.css + '</style></head><body>' + c.html + '<script>' + safeJs(c.js) + '<\/script></body></html>';
  }
  function exportDoc(c){
    return '<!doctype html>\n<html lang="id">\n<head>\n<meta charset="UTF-8">\n<meta name="viewport" content="width=device-width,initial-scale=1">\n<title>Proyek</title>\n<style>\n' +
      UNSLOP_IFRAME_TOKENS + '\n' + c.css + '\n</style>\n</head>\n<body>\n' + c.html + '\n<script>\n' + safeJs(c.js) + '\n<\/script>\n</body>\n</html>\n';
  }
  var frame = $('frame');
  function addLog(t, m){
    var box = $('con');
    var l = document.createElement('div');
    l.className = 'ln ' + t;
    l.textContent = m;
    box.appendChild(l);
    while (box.children.length > 200) box.removeChild(box.firstChild);
    box.scrollTop = box.scrollHeight;
  }
  window.addEventListener('message', function(e){
    if (e.source !== frame.contentWindow) return;
    var d = e.data;
    if (!d || d.mzc !== 1) return;
    addLog(String(d.t), String(d.m).slice(0, 2000));
  });
  $('conClear').addEventListener('click', function(){ $('con').textContent = ''; });
  function render(force){
    var c = getCode(), key = JSON.stringify(c);
    if (!force && !dirty) return; // kode belum berubah: jangan muat ulang pratinjau
    if (!force && key === lastCode) { dirty = false; return; }
    lastCode = key;
    dirty = false;
    $('con').textContent = '';
    frame.srcdoc = build(c);
  }
  function view(v, force){
    ['kode', 'hasil'].forEach(function(x){ $('v-' + x).classList.toggle('on', x === v); });
    $('seg').querySelectorAll('[data-v]').forEach(function(b){ b.classList.toggle('on', b.dataset.v === v); });
    if (v === 'hasil') render(force); else cm.refresh();
  }
  $('seg').querySelectorAll('[data-v]').forEach(function(b){ b.addEventListener('click', function(){ view(b.dataset.v); }); });
  $('run').addEventListener('click', function(){ view('hasil', true); });

  /* ----- Panel bawah ----- */
  function closeSheet(){ $('sheet').classList.add('off'); }
  $('sheet').addEventListener('click', function(e){ if (e.target === this) closeSheet(); });
  function openSheet(title, fill){
    var p = $('panel');
    p.textContent = '';
    var h = document.createElement('div');
    h.className = 'ph';
    var b = document.createElement('b');
    b.textContent = title;
    var x = document.createElement('button');
    x.type = 'button';
    x.textContent = 'Tutup';
    x.addEventListener('click', closeSheet);
    h.append(b, x);
    p.appendChild(h);
    fill(p);
    $('sheet').classList.remove('off');
  }
  function armed(btn, hint, fn){
    var orig = btn.textContent, on = false, t = 0;
    function off(){ on = false; btn.textContent = orig; btn.classList.remove('warn'); }
    btn.addEventListener('click', function(){
      if (!on) { on = true; btn.textContent = hint; btn.classList.add('warn'); t = setTimeout(off, 3000); return; }
      clearTimeout(t);
      off();
      fn();
    });
  }
  function loadCode(c){
    docs.html.setValue(c.html || '');
    docs.css.setValue(c.css || '');
    docs.js.setValue(c.js || '');
    docs.html.clearHistory();
    docs.css.clearHistory();
    docs.js.clearHistory();
    setFile('html');
    ls.set(K.d, JSON.stringify(getCode()));
  }
  function projects(){
    try { var a = JSON.parse(ls.get(K.p) || '[]'); return Array.isArray(a) ? a : []; } catch (e) { return []; }
  }
  function openProjects(){
    openSheet('Proyek tersimpan', function(p){
      var name = document.createElement('input');
      name.className = 'in';
      name.maxLength = 40;
      name.placeholder = 'Nama proyek';
      name.value = 'Proyek ' + (projects().length + 1);
      var save = document.createElement('button');
      save.type = 'button';
      save.className = 'btn pri';
      save.textContent = 'Simpan kode saat ini';
      save.addEventListener('click', function(){
        var n = name.value.trim().slice(0, 40) || 'Tanpa nama';
        var c = getCode();
        var all = projects();
        all.unshift({ id: Date.now().toString(36), name: n, ts: Date.now(), html: c.html, css: c.css, js: c.js });
        all = all.slice(0, 20);
        if (!ls.set(K.p, JSON.stringify(all))) { msg('Penyimpanan penuh atau diblokir browser.'); return; }
        msg('Proyek disimpan.');
        openProjects();
      });
      p.append(name, save);
      var list = projects();
      if (!list.length) {
        var empty = document.createElement('div');
        empty.className = 'row';
        empty.textContent = 'Belum ada proyek tersimpan.';
        p.appendChild(empty);
      }
      list.forEach(function(it){
        var row = document.createElement('div');
        row.className = 'row';
        var t = document.createElement('div');
        t.className = 't';
        var b = document.createElement('b');
        b.textContent = it.name;
        var s = document.createElement('small');
        s.textContent = new Date(it.ts).toLocaleString('id-ID', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
        t.append(b, s);
        var op = document.createElement('button');
        op.type = 'button';
        op.className = 'btn';
        op.textContent = 'Buka';
        armed(op, 'Ganti kode?', function(){ loadCode(it); closeSheet(); msg('Proyek dibuka.'); });
        var del = document.createElement('button');
        del.type = 'button';
        del.className = 'btn';
        del.textContent = 'Hapus';
        armed(del, 'Yakin?', function(){
          ls.set(K.p, JSON.stringify(projects().filter(function(x){ return x.id !== it.id; })));
          openProjects();
        });
        row.append(t, op, del);
        p.appendChild(row);
      });
    });
  }
  function openSamples(){
    openSheet('Contoh kode', function(p){
      SAMPLES.forEach(function(sm){
        var row = document.createElement('div');
        row.className = 'row';
        var t = document.createElement('div');
        t.className = 't';
        var b = document.createElement('b');
        b.textContent = sm.n;
        var s = document.createElement('small');
        s.textContent = sm.d;
        t.append(b, s);
        var use = document.createElement('button');
        use.type = 'button';
        use.className = 'btn';
        use.textContent = 'Pakai';
        armed(use, 'Ganti kode?', function(){ loadCode(sm); closeSheet(); msg('Contoh dimuat.'); });
        row.append(t, use);
        p.appendChild(row);
      });
    });
  }

  /* ----- Unduh, salin, reset ----- */
  function download(){
    var url = URL.createObjectURL(new Blob([exportDoc(getCode())], { type: 'text/html' }));
    var a = document.createElement('a');
    a.href = url;
    a.download = 'proyek.html';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 3000);
    msg('Mengunduh proyek.html...');
  }
  function copyAll(){
    var text = exportDoc(getCode());
    function fb(){
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) {}
      ta.remove();
      msg(ok ? 'Kode disalin.' : 'Gagal menyalin.');
    }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function(){ msg('Kode disalin.'); }, fb);
    else fb();
  }
  armed($('tools').querySelector('[data-a="reset"]'), 'Yakin hapus semua?', function(){ loadCode({ html: '', css: '', js: '' }); msg('Kode dikosongkan.'); });
  $('tools').querySelectorAll('[data-a]').forEach(function(b){
    var a = b.dataset.a;
    if (a === 'reset') return;
    b.addEventListener('click', function(){
      if (a === 'proyek') openProjects();
      else if (a === 'contoh') openSamples();
      else if (a === 'unduh') download();
      else if (a === 'salin') copyAll();
    });
  });
})();
</script>
<script src="editor-pro.js?v=19"></script>

<style id="mz-design-system">
/* ==========================================================================
   INK NEUTRAL — satu sistem desain, ramp abu, tanpa warna tema.
   Arah: tenang, presisi, sedikit hangat. Header 48px, grid 4px.
   ========================================================================== */

/* --- Token -------------------------------------------------------------- */
:root {
  color-scheme: light;
  --ui-bg:#fafafa;
  --ui-surface:#ffffff;
  --ui-raised:#f4f4f5;
  --ui-border:#e5e5e5;
  --ui-text:#171717;
  --ui-text-2:#525252;
  --ui-text-3:#737373;
  --ui-accent:#171717;
  --ui-on-accent:#ffffff;
  --ui-positive:#15803d;
  --ui-negative:#b91c1c;
  --ui-font:"Inter","IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --ui-mono:ui-monospace,"SFMono-Regular",Consolas,monospace;
  --ui-ease:cubic-bezier(.22,1,.36,1);
  --ui-shadow:0 1px 2px rgba(0,0,0,.05);
  --ui-float:0 8px 24px rgba(0,0,0,.08);
  --ui-overlay:rgba(23,23,23,.48);
  --ui-canvas:var(--ui-bg); --ui-surface-2:var(--ui-raised);
  --ui-text-muted:var(--ui-text-3); --ui-ink:var(--ui-text);
  --ui-danger:var(--ui-negative); --ui-success:var(--ui-positive);
  --ui-warning:var(--ui-text-2); --ui-info:var(--ui-text-2);
  --ui-accent-bg:var(--ui-accent); --ui-content-max:1080px;

  --bg:var(--ui-bg); --bg2:var(--ui-surface); --card:var(--ui-surface);
  --card-2:var(--ui-raised); --panel:var(--ui-surface); --inp:var(--ui-surface);
  --line:var(--ui-border); --text:var(--ui-text); --txt:var(--ui-text);
  --head:var(--ui-text); --muted:var(--ui-text-3); --mut:var(--ui-text-3);
  --accent:var(--ui-accent); --acc:var(--ui-accent);
  --brand:var(--ui-accent); --brand-hover:var(--ui-accent);
  --gold:var(--ui-text-2); --warn:var(--ui-text-2); --err:var(--ui-negative);
  --purple:var(--ui-text); --black:var(--ui-text); --on:var(--ui-on-accent);
  --shadow:var(--ui-border); --radius:12px;
  --code-strong:var(--ui-text); --code-mid:var(--ui-text-2); --code-dim:var(--ui-text-3);
  --sh-card:var(--ui-surface); --sh-card-foreground:var(--ui-text);
  --sh-border:var(--ui-border); --sh-input:var(--ui-surface);
  --sh-primary:var(--ui-accent); --sh-ring:var(--ui-accent);
  --sp:var(--ui-accent); --sp-d:var(--ui-accent); --sp-ink:var(--ui-on-accent);
}

html body:not(.light-mode) {
  color-scheme:dark;
  --ui-bg:#141415; --ui-surface:#19191b; --ui-raised:#232325;
  --ui-border:#2b2b2e; --ui-text:#ededed; --ui-text-2:#a1a1a6;
  --ui-text-3:#8f8f95; --ui-accent:#ededed; --ui-on-accent:#171717;
  --ui-positive:#4cc38a; --ui-negative:#e5484d;
  --ui-shadow:0 1px 2px rgba(0,0,0,.32);
  --ui-float:0 8px 24px rgba(0,0,0,.4);
  --ui-overlay:rgba(0,0,0,.62);
}
.dark { color-scheme:dark; }

/* --- Dasar -------------------------------------------------------------- */
*,*::before,*::after { box-sizing:border-box; }
html { scroll-behavior:smooth; }
body {
  margin:0; min-height:100vh; background:var(--ui-bg); color:var(--ui-text);
  font:14px/1.6 var(--ui-font); -webkit-font-smoothing:antialiased;
}
body.mz-lock,body.mz-sheetlock,body.mz-musiclock { overflow:hidden; }
html.mz-musiclock,html.mz-musiclock body { overflow:hidden; }
a { color:inherit; text-decoration:none; }
img { max-width:100%; display:block; }
button,input,select,textarea { font:inherit; color:inherit; }
button { cursor:pointer; }
button:disabled,input:disabled,select:disabled,textarea:disabled { opacity:.5; cursor:not-allowed; }
:is(a,button,input,select,textarea,[role="button"]):focus-visible {
  outline:2px solid var(--ui-accent); outline-offset:2px;
}
h1,h2,h3,h4 { font-weight:500; letter-spacing:0; line-height:1.2; margin:0 0 12px; }
h1 { font-size:clamp(28px,3vw,36px); letter-spacing:-.01em; }
h2 { font-size:clamp(22px,2.4vw,28px); letter-spacing:-.01em; }
h3 { font-size:16px; }
h4 { font-size:14px; }
p { margin:0 0 12px; }
small { font-size:12px; }
[hidden] { display:none!important; }
.tabular-nums { font-variant-numeric:tabular-nums; }
.divider { border-top:1px solid var(--ui-border); margin:16px 0; }
.flex { display:flex; }
.center { text-align:center; }
.full { width:100%; }
.no-margin { margin:0; }

/* --- Header: sengaja pendek dan sunyi ---------------------------------- */
header {
  position:sticky; top:0; z-index:30; background:var(--ui-surface);
  border-bottom:1px solid var(--ui-border);
}
.topbar {
  display:flex; align-items:center; justify-content:space-between; gap:8px;
  height:48px; width:min(1200px,calc(100% - 32px)); margin:0 auto;
}
.owner-badge {
  display:inline-flex; align-items:center; gap:8px; min-height:32px;
  padding:0 8px; border-radius:8px; font-size:12px; color:var(--ui-text-2);
}
.owner-badge:hover { background:var(--ui-raised); }
.badge-avatar {
  width:24px; height:24px; border-radius:50%; background:var(--ui-raised);
  display:grid; place-items:center; font-size:11px; color:var(--ui-text-2);
  flex:none;
}
.topbar-actions,.pf-actions,.auth-prov { display:flex; align-items:center; gap:4px; flex-wrap:wrap; }
.icon { width:16px; height:16px; stroke:currentColor; fill:none;
  stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round; }
#theme-toggle,#menu-toggle,#sidebar-close {
  width:32px; height:32px; padding:0; display:grid; place-items:center;
}
.verified-badge,.verified-badge2 { display:inline-flex; color:var(--ui-positive); vertical-align:middle; }
.verified-badge .badge-icon { width:16px; height:16px; }
.verified-badge2 .badge-icon { width:14px; height:14px; }
.owner-role { color:var(--ui-text-2); }
.owner-panel { padding:12px 16px; background:var(--ui-raised); border-bottom:1px solid var(--ui-border); }
.auth-form {
  max-width:380px; margin:0 auto; padding:20px; background:var(--ui-surface);
  border:1px solid var(--ui-border); border-radius:12px; box-shadow:var(--ui-shadow);
}
.auth-tabs,.mzs-tabs,.ocean-nav,.pf-tabs,.ftabs,.dl-tabs {
  display:flex; gap:4px; border-bottom:1px solid var(--ui-border);
  margin-bottom:16px; overflow-x:auto;
}
.auth-tabs button,.mzs-tabs button,.ocean-nav button,.pf-tabs button,.ftabs button,.dl-tabs button {
  flex:1; padding:8px 12px; min-height:36px; background:var(--ui-surface); border:0;
  border-bottom:2px solid transparent; font-size:14px; font-weight:500;
  color:var(--ui-text-2);
}
.auth-tabs button.active,.mzs-tabs button.on,.ocean-nav button.active,
.pf-tabs button.on,.ftabs button.on,.dl-tabs button.active {
  color:var(--ui-text); border-bottom-color:var(--ui-accent);
}
.pass-wrap { position:relative; }
.pass-eye { position:absolute; right:8px; top:50%; transform:translateY(-50%);
  background:none; border:0; color:var(--ui-text-2); }
.error,.gate-error,.dl-error,.rc-error,.tm-error { color:var(--ui-negative); font-weight:500; }
.correct { color:var(--ui-positive); font-weight:500; }
.wrong { color:var(--ui-negative); font-weight:500; }

/* --- Tata letak --------------------------------------------------------- */
.wrap,.container {
  width:min(1080px,calc(100% - 32px)); margin:0 auto; padding:24px 0 56px;
}
header .container { padding:0; width:min(1200px,calc(100% - 32px)); }
.grid,.projects { display:grid; gap:16px; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); }
.app { padding:16px 16px 88px; }
.tab { display:none; }
.tab.active { display:block; animation:inkIn 180ms var(--ui-ease); }
@keyframes inkIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:none} }
.ocean-view { display:none; }
.ocean-view.active { display:block; }
.show { display:block!important; }
.is-loading { opacity:.6; pointer-events:none; }
.off { opacity:.45; pointer-events:none; }

/* --- Permukaan ---------------------------------------------------------- */
.card,.panel,.about-card,.security-card,.email-card,.profile-card,.tool-card,
.project,.skill,.quote,.game-box,.dl-box,.rc-box,.tm-box,.amfind-result,
.email-section,.contact-block,.pf-info,.pf-sheet-panel,.ttt-board,.mem-grid,
.wam-grid,.g2048-board,.wheel-wrap,.rt-area,.con,.sheet,.view,.sf,.oh {
  background:var(--ui-surface); color:var(--ui-text);
  border:1px solid var(--ui-border); border-radius:12px;
  box-shadow:var(--ui-shadow); padding:20px;
}
.card,.panel { margin-bottom:16px; }
.hero { border-left:2px solid var(--ui-accent); }
.banner {
  display:flex; align-items:center; justify-content:space-between; gap:16px;
  padding:16px 20px; margin-bottom:16px; background:var(--ui-surface);
  border:1px solid var(--ui-border); border-radius:12px;
}
.banner-title { font-size:15px; font-weight:500; }
.banner-icon {
  width:40px; height:40px; flex:none; display:grid; place-items:center;
  color:var(--ui-text-2); background:var(--ui-raised); border-radius:8px;
}
.eyebrow,.about-kicker,.email-kicker,.label,.tm-label,.mz-now-label {
  font:400 12px/1.4 var(--ui-mono); color:var(--ui-text-3); margin-bottom:4px;
}
.sub,.muted,.note,.foot-note,.pf-bio,.banner-sub,.mz-hint,.pf-hint,.pf-fav-note,.mz-tech-note {
  color:var(--ui-text-2); font-size:13px;
}
.accent { color:var(--ui-text); }
.feature-icon { width:24px; height:24px; color:var(--ui-text-2); }

/* --- Kontrol ------------------------------------------------------------ */
.btn,.mzs-btn,.dl-mini,.gc-act,.gc-play,#run,.keys button,.seg button,.ftabs button,
.auth-tab,.ocean-tab,.dl-tab,.game-controls button,#theme-toggle,#auth-toggle {
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  min-height:36px; padding:8px 12px; background:var(--ui-surface);
  color:var(--ui-text); border:1px solid var(--ui-border); border-radius:8px;
  font-size:14px; font-weight:500; line-height:1.2;
  transition:background-color 120ms var(--ui-ease),border-color 120ms var(--ui-ease);
}
.btn:hover,.mzs-btn:hover,.gc-act:hover,.gc-play:hover,#run:hover,
.keys button:hover,.seg button:hover,.ftabs button:hover,
.auth-tab:hover,.ocean-tab:hover,.dl-tab:hover,.game-controls button:hover {
  background:var(--ui-raised); border-color:var(--ui-text-3);
}
.btn:active,button:active { transform:none; }
.btn.primary,.btn.pri,.nav-btn.active,.gc-act.rec,#mzPlay,.gc-play,
.mzs-tabs button.on,.ocean-tab.active,.dl-tab.active,.email-step.active,
.game-controls button.active,.mzs-chips button.on,.keys button.on,
.seg button.on,.ftabs button.on,#run,.auth-tab.active,.pf-tabs button.on {
  background:var(--ui-accent); color:var(--ui-on-accent); border-color:var(--ui-accent);
}
.btn.ghost,.ghost { background:transparent; }
input,select,textarea,.input-field,.dl-paste {
  width:100%; padding:8px 12px; min-height:36px; background:var(--ui-surface);
  color:var(--ui-text); border:1px solid var(--ui-border); border-radius:8px;
}
input:focus,textarea:focus,select:focus { outline:2px solid var(--ui-accent); outline-offset:2px; }
.pill,.tag,.platform-chip,.pf-chip,.owner-badge {
  display:inline-flex; align-items:center; gap:6px; padding:4px 8px;
  background:var(--ui-raised); color:var(--ui-text-2);
  border:1px solid var(--ui-border); border-radius:6px;
  font-size:12px; font-weight:400;
}
.spinner { width:20px; height:20px; border:2px solid var(--ui-border);
  border-top-color:var(--ui-accent); border-radius:50%; animation:inkSpin .8s linear infinite; }
@keyframes inkSpin { to{transform:rotate(360deg)} }

/* --- Sidebar & navigasi bawah ------------------------------------------- */
.sidebar-overlay { position:fixed; inset:0; z-index:80; background:var(--ui-overlay); display:none; }
.sidebar-overlay.active { display:block; }
.sidebar {
  position:fixed; left:0; top:0; bottom:0; z-index:90; width:min(260px,86vw);
  background:var(--ui-surface); border-right:1px solid var(--ui-border);
  transform:translateX(-105%); transition:transform 180ms var(--ui-ease);
  display:flex; flex-direction:column;
}
.sidebar.active { transform:none; }
.sidebar-head {
  display:flex; align-items:center; justify-content:space-between;
  height:48px; padding:0 16px; border-bottom:1px solid var(--ui-border);
}
.logo { font-size:16px; font-weight:500; letter-spacing:0; }
.sidebar-nav { display:flex; flex-direction:column; gap:4px; padding:12px; overflow-y:auto; flex:1; }
.nav-btn {
  display:flex; align-items:center; gap:12px; width:100%; min-height:36px;
  padding:8px 12px; background:transparent; border:0; border-radius:8px;
  font-size:14px; font-weight:500; text-align:left;
  transition:background-color 120ms var(--ui-ease);
}
.nav-btn:hover { background:var(--ui-raised); }
.nav-btn .icon { width:18px; height:18px; flex:none; }
.nav-btn.home { display:none; }
.sidebar-foot { padding:12px; border-top:1px solid var(--ui-border); }
.mz-sidelinks { display:flex; gap:8px; margin-bottom:8px; }
.mz-sl {
  flex:1; display:flex; align-items:center; justify-content:center; gap:6px;
  min-height:36px; padding:8px 4px; border:1px solid var(--ui-border);
  border-radius:8px; background:var(--ui-surface); font-size:12px;
}
.mz-sl svg { width:16px; height:16px; }
.mz-lang { display:flex; align-items:center; gap:8px; }
.mz-lang select { padding:8px; }
.bottom-nav {
  display:flex; justify-content:space-around; gap:4px; position:fixed;
  left:0; right:0; bottom:0; z-index:60;
  padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));
  background:var(--ui-surface); border-top:1px solid var(--ui-border);
}
.bottom-nav .nav-btn {
  width:auto; flex:1; flex-direction:column; gap:4px; padding:4px 2px;
  font-size:11px; text-align:center;
}
.bottom-nav .nav-btn.home {
  display:flex; margin-top:-20px; width:44px; height:44px; flex:none;
  border:1px solid var(--ui-accent); border-radius:50%;
  background:var(--ui-accent); color:var(--ui-on-accent);
}
.bottom-nav .nav-btn.home span { width:28px; height:28px; display:grid; place-items:center; }
footer { text-align:center; color:var(--ui-text-3); padding:24px 16px;
  border-top:1px solid var(--ui-border); font-size:12px; }

/* --- Beranda & profil --------------------------------------------------- */
.profile-top { display:flex; gap:12px; align-items:center; }
.avatar,.pf-av {
  width:56px; height:56px; flex:none; border-radius:50%; overflow:hidden;
  background:var(--ui-raised); display:grid; place-items:center; color:var(--ui-text-2);
}
.avatar img,.pf-av img { width:100%; height:100%; object-fit:cover; }
.profile-name { font-size:16px; font-weight:500; }
.profile-name>span:first-child { color:var(--ui-text-2); }
.stat-row,.pf-stats,.pf-bd-grid,.pf-sw-grid {
  display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:16px;
}
.stat { padding:12px 8px; text-align:center; background:var(--ui-raised); border-radius:8px; }
.stat b { display:block; font-size:28px; font-weight:500; font-variant-numeric:tabular-nums; }
.stat span { font-size:12px; color:var(--ui-text-3); }
.skills { display:flex; flex-wrap:wrap; gap:8px; }
.skill { padding:8px 12px; display:flex; align-items:center; gap:8px; }
.project-links a { display:inline-flex; margin-right:8px; padding:8px 12px;
  border:1px solid var(--ui-border); border-radius:8px; font-size:12px; }
.tool-icon { width:40px; height:40px; flex:none; display:grid; place-items:center;
  background:var(--ui-raised); color:var(--ui-text-2); border-radius:8px; }
.about-block { border-top:1px solid var(--ui-border); padding-top:16px; margin-top:16px; }
.icon-inline,.badge-icon { display:inline-flex; vertical-align:middle; }

/* Badge avatar: bentuk geometris, tanpa glyph dekoratif. */
[class*="bd-a-"] { position:relative; isolation:isolate; }
[class*="bd-a-"]::before,[class*="bd-a-"]::after {
  content:''; position:absolute; z-index:2; pointer-events:none;
  background:var(--ui-text-3);
}
.bd-a-bunga::before { width:12px; height:12px; border:2px solid var(--ui-text-3);
  background:none; border-radius:50%; top:-4px; right:-4px; }
.bd-a-bintang::before,.bd-a-api::before { width:0; height:0; background:none;
  border-left:6px solid transparent; border-right:6px solid transparent;
  border-bottom:10px solid var(--ui-text-3); top:-6px; right:-4px; }
.bd-a-api::before { right:auto; left:50%; transform:translateX(-50%); }
.bd-a-hati::before { width:10px; height:10px; top:-2px; right:-2px;
  transform:rotate(45deg); border-radius:2px; }
.bd-a-pita::before { width:10px; height:10px; top:-4px; left:-4px; border-radius:2px; }
.bd-a-mahkota::before { width:16px; height:4px; top:-4px; left:50%;
  transform:translateX(-50%); border-radius:2px; }
.bd-a-kilat::before { width:3px; height:12px; top:-4px; right:-2px; transform:rotate(20deg); }
.bd-a-kucing::before,.bd-a-kucing::after,.bd-a-tanduk::before,.bd-a-tanduk::after {
  width:0; height:0; background:none; border-left:5px solid transparent;
  border-right:5px solid transparent; border-bottom:9px solid var(--ui-text-3); z-index:-1;
}
.bd-a-kucing::before { top:-6px; left:4px; }
.bd-a-kucing::after { top:-6px; right:4px; }
.bd-a-tanduk::before { top:-8px; left:4px; transform:rotate(-24deg); }
.bd-a-tanduk::after { top:-8px; right:4px; transform:rotate(24deg); }
.bd-a-halo::before { width:60%; height:8px; background:none;
  border:2px solid var(--ui-text-3); border-radius:50%; top:-8px; left:20%; }
.bd-dot { width:38px; height:38px; }

.pf-sheet-panel { position:fixed; inset:0; z-index:100; overflow:auto; padding:20px; }
.pf-sheet-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
.pf-sheet-row,.pf-form-row,.pf-row { display:flex; gap:8px; align-items:center; margin-bottom:12px; flex-wrap:wrap; }
.pf-form-row>*,.pf-row>* { flex:1; min-width:140px; }
.pf-banner { padding:16px; background:var(--ui-raised); border-radius:8px; }
.pf-prog,.pf-bar,.pf-up { height:8px; background:var(--ui-raised); border-radius:999px; overflow:hidden; }
.pf-prog i,.pf-bar i,.pf-up i { display:block; height:100%; background:var(--ui-accent); }

/* --- Musik -------------------------------------------------------------- */
.mz-hasmini { padding-bottom:92px; }
.mzm {
  position:fixed; left:12px; right:12px;
  bottom:calc(12px + env(safe-area-inset-bottom,0px)); z-index:70;
  max-width:520px; margin:0 auto; display:flex; align-items:center; gap:8px;
  padding:8px; background:var(--ui-surface); color:var(--ui-text);
  border:1px solid var(--ui-border); border-radius:12px; box-shadow:var(--ui-float);
}
.mzm[hidden] { display:none; }
.mzm-bar { position:absolute; left:0; right:0; top:0; height:3px; background:var(--ui-raised); }
.mzm-bar i { display:block; height:100%; width:0; background:var(--sp); }
.mzm-main { flex:1; min-width:0; display:flex; align-items:center; gap:8px;
  background:none; border:0; padding:0; text-align:left; }
.mzm-main img,.mzm-ph { width:40px; height:40px; object-fit:cover; flex:none;
  background:var(--ui-raised); border-radius:8px; }
.mzm-t,.mzs-it { min-width:0; display:flex; flex-direction:column; }
.mzm-t b,.mzs-it b { font-size:14px; font-weight:500; overflow:hidden;
  text-overflow:ellipsis; white-space:nowrap; }
.mzm-t small,.mzs-it small { color:var(--ui-text-3); font-size:12px;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.mzm-b { width:32px; height:32px; flex:none; display:grid; place-items:center;
  background:none; border:0; padding:0; }
.mzm-b svg { width:18px; height:18px; }
#mzPlay,.mz-playbig { background:var(--sp); color:var(--sp-ink); border-radius:50%; }
.mzs { position:fixed; inset:0; z-index:95; display:flex; align-items:stretch;
  justify-content:center; background:var(--ui-overlay); overscroll-behavior:contain; }
.mzs.mz-off { visibility:hidden; pointer-events:none; opacity:0; }
.mzs-panel { width:100%; max-width:none; height:100%; display:flex; flex-direction:column;
  padding:16px 16px calc(24px + env(safe-area-inset-bottom,0px)); overflow:hidden;
  background:var(--ui-surface); color:var(--ui-text); }
.mzs-panel>* { flex:none; }
.mz-scroll { flex:1 1 auto!important; overflow-y:auto; }
.mzs-head { position:sticky; top:-16px; z-index:2; display:flex; justify-content:space-between;
  align-items:center; padding:8px 0 12px; background:var(--ui-surface); margin-bottom:8px; }
.mzs-head-title { display:inline-flex; align-items:center; gap:8px; }
.mzs-head button { background:none; border:0; color:var(--ui-text-2); }
.mzs-head b { font-weight:500; }
.mzs-row,.mz-search-top { display:flex; gap:8px; align-items:center; }
.mzs-row input { flex:1; min-width:0; }
.mzs-hint { margin:8px 0; min-height:1.2em; color:var(--ui-text-3); font-size:12px; }
.mzs-item { display:flex; align-items:center; gap:8px; width:100%; padding:8px;
  background:none; border:0; border-radius:8px; text-align:left; }
.mzs-item:hover,.mzs-item.on { background:var(--ui-raised); }
.mzs-item img,.mzs-item .ph { width:44px; height:44px; object-fit:cover; flex:none;
  background:var(--ui-raised); border-radius:8px; }
.mzs-d { color:var(--ui-text-3); font-size:12px; flex:none; }
.mzs-yt { position:relative; width:100%; aspect-ratio:16/9; margin-top:8px;
  background:var(--ui-raised); border-radius:8px; overflow:hidden; }
.mzs-yt iframe { position:absolute; inset:0; width:100%; height:100%; border:0; }
.mz-offp { position:fixed!important; left:-9999px; top:0; width:320px; pointer-events:none; }
.mz-now { background:var(--ui-raised); border-radius:12px; padding:12px; margin-bottom:12px; }
.mz-now-art { width:100%; aspect-ratio:1; object-fit:cover; border-radius:8px; }
.mz-now-meta { display:flex; justify-content:space-between; align-items:center; gap:8px; }
.mz-controls { display:flex; gap:8px; align-items:center; justify-content:center; flex-wrap:wrap; }
.mz-progress { width:100%; height:6px; background:var(--ui-border); border-radius:999px; overflow:hidden; }
.mz-progress i { display:block; height:100%; background:var(--sp); }
.mz-eq { display:inline-flex; align-items:flex-end; gap:2px; height:14px; margin-left:8px; }
.mz-eq i { width:2px; height:3px; background:var(--sp); }
.mz-eq.on i { animation:inkEq .8s ease-in-out infinite alternate; }
.mz-eq.on i:nth-child(2) { animation-duration:.55s; }
.mz-eq.on i:nth-child(3) { animation-duration:.7s; }
.mz-eq.on i:nth-child(4) { animation-duration:.45s; }
@keyframes inkEq { from{height:3px} to{height:14px} }
.mz-lyrics-body { display:none; padding:12px; background:var(--ui-raised); border-radius:8px; }
.mz-lyrics-open .mz-lyrics-body { display:block; }
.mz-ly-in .mz-lyrics-body { animation:inkIn 180ms var(--ui-ease); }
.mz-ly-live { color:var(--ui-text); font-weight:500; }
.mz-search-body,.mz-search-wrap { margin-top:8px; }
.mz-chips,.mzs-chips { display:flex; gap:6px; flex-wrap:wrap; }
.mz-playbig { width:64px; height:64px; display:grid; place-items:center; }
.mz-tech-up { padding:12px; background:var(--ui-raised); border-radius:8px; }
.mz-rv { opacity:0; transform:translateY(12px); transition:opacity 300ms var(--ui-ease),transform 300ms var(--ui-ease); }
.mz-rv.mz-in { opacity:1; transform:none; }

/* --- Chat --------------------------------------------------------------- */
.gc { display:flex; flex-direction:column; height:100vh; height:100dvh; max-width:760px;
  margin:0 auto; background:var(--ui-bg); color:var(--ui-text); }
.gc-head,.gc-bar { display:flex; align-items:center; gap:8px; padding:12px 16px;
  background:var(--ui-surface); border-bottom:1px solid var(--ui-border); }
.gc-head { position:sticky; top:0; z-index:20; }
.gc-title { font-size:15px; font-weight:500; }
.gc-list { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:8px; }
.gc-bub { max-width:min(85%,560px); padding:8px 12px; background:var(--ui-surface);
  border:1px solid var(--ui-border); border-radius:12px; }
.gc-row.me { align-self:flex-end; }
.gc-row.me .gc-bub { background:var(--ui-accent); color:var(--ui-on-accent); border-color:var(--ui-accent); }
.gc-strip { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.gc-dot,.gc-ib { width:8px; height:8px; background:var(--ui-text-3); border-radius:50%; }
.gc-replybar,.gc-notes { padding:8px; border-top:1px solid var(--ui-border); background:var(--ui-surface); }
.gc-emoji { font-size:16px; }
.rc-row,.tm-row { display:flex; gap:8px; align-items:center; margin-bottom:8px; flex-wrap:wrap; }
.rc-result,.tm-mail { padding:12px; background:var(--ui-surface);
  border:1px solid var(--ui-border); border-radius:8px; }
.tm-mail { width:100%; overflow-wrap:anywhere; }
.tm-head { display:flex; justify-content:space-between; align-items:center; gap:8px; }

/* --- Game --------------------------------------------------------------- */
.game-controls,.gm-row,.gm-top,.wam-top { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.wam-top,.pf-prog-top { display:flex; justify-content:space-between; align-items:center; gap:8px; }
.ttt-board { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; max-width:340px; padding:12px; }
.ttt-cell { aspect-ratio:1; display:grid; place-items:center; font-size:28px; font-weight:500;
  background:var(--ui-raised); border:1px solid var(--ui-border); border-radius:8px; }
.mem-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; max-width:420px; padding:12px; }
.mem-card { aspect-ratio:1; display:grid; place-items:center; background:var(--ui-raised);
  border:1px solid var(--ui-border); border-radius:8px; cursor:pointer; }
.wam-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; max-width:420px; padding:12px; }
.wam-hole { aspect-ratio:1; display:grid; place-items:center; font-size:28px;
  background:var(--ui-raised); border:1px solid var(--ui-border); border-radius:8px; cursor:pointer; }
.wam-hole.up { background:var(--ui-accent); color:var(--ui-on-accent); }
.g2048-board { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; max-width:380px; padding:12px; }
.g2048-board>div { display:grid; place-items:center; aspect-ratio:1; font-weight:500;
  background:var(--ui-raised); border-radius:8px; }
.v2,.v4,.v8,.v16 { background:var(--ui-accent)!important; color:var(--ui-on-accent)!important; }
.wheel-pointer { width:0; height:0; border-left:8px solid transparent;
  border-right:8px solid transparent; border-top:14px solid var(--ui-accent); margin:0 auto; }
.rt-area { min-height:140px; }
.typing-text { font-family:var(--ui-mono); font-size:15px; }
.dpad { display:grid; grid-template-columns:repeat(3,40px); gap:4px; justify-content:center; }
.gm-msg { font-weight:500; }
.up,.done { background:var(--ui-accent); color:var(--ui-on-accent); }
.typing-stats,.rt-stats { font:400 12px var(--ui-mono); color:var(--ui-text-3); }

/* --- Downloader / email / editor ---------------------------------------- */
.dl-form,.rc-form { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:12px; }
.dl-form input,.rc-form input { flex:1; min-width:200px; }
.dl-formats,.platforms { display:flex; gap:8px; flex-wrap:wrap; }
.dl-result,.tm-body,.tm-raw,.amfind-result { margin-top:12px; }
.dl-download-panel { display:flex; gap:8px; flex-wrap:wrap; }
.dl-history { margin-top:16px; }
.email-grid,.step-connector { display:grid; gap:8px; }
.email-step { padding:12px; background:var(--ui-raised);
  border:1px solid var(--ui-border); border-radius:8px; font-size:14px; }
.email-step.active { background:var(--ui-accent); color:var(--ui-on-accent); border-color:var(--ui-accent); }
.email-step.completed { background:var(--ui-positive); color:var(--ui-on-accent); border-color:var(--ui-positive); }
.email-step.failed { background:var(--ui-negative); color:var(--ui-on-accent); border-color:var(--ui-negative); }
.status { display:inline-block; padding:4px 8px; background:var(--ui-accent);
  color:var(--ui-on-accent); border-radius:6px; font-size:12px; }
.sheet { min-height:300px; }
.top { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:12px; }
.tools,.keys,.con-h { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px; }
.CodeMirror { height:340px; background:var(--ui-surface)!important; color:var(--ui-text)!important;
  border:1px solid var(--ui-border); font-family:var(--ui-mono); }
.CodeMirror-gutters { background:var(--ui-raised)!important; border-right:1px solid var(--ui-border)!important; }
.cm-s-default .cm-keyword,.cm-s-default .cm-def { color:var(--ui-text)!important; font-weight:500; }
.cm-s-default .cm-string,.cm-s-default .cm-number { color:var(--ui-text-2)!important; }
.cm-s-default .cm-comment { color:var(--ui-text-3)!important; }

/* --- Responsif & motion ------------------------------------------------- */
@media (min-width:768px) { .container { width:min(820px,92%); } header .container { width:min(1200px,calc(100% - 32px)); } }
@media (min-width:1100px) { .container { width:min(1080px,90%); } }
@media (min-width:1400px) { .container { width:min(1200px,88%); } }
@media (max-width:640px) {
  h1 { font-size:28px; }
  .stat-row,.pf-stats,.pf-bd-grid,.pf-sw-grid { grid-template-columns:repeat(2,1fr); }
  .banner { padding:12px 16px; }
}
@media (prefers-reduced-motion:reduce) {
  *,*::before,*::after { scroll-behavior:auto!important; animation-duration:.01ms!important;
    animation-iteration-count:1!important; transition-duration:.01ms!important; }
}
</style>
<script id="mz-theme-authority">
(function(){
  var KEY='mz_settings';
  function id(){
    try{return JSON.parse(localStorage.getItem(KEY)||'{}').theme||'mono';}catch(e){return 'mono';}
  }
  window.mzApplyTheme=function(){
    var t=id(), h=document.documentElement, b=document.body, mode;
    if(t==='mono')h.removeAttribute('data-mz-accent');
    else h.setAttribute('data-mz-accent',t);
    if(b){
      try{mode=localStorage.getItem('mz-theme');}catch(e){}
      b.classList.toggle('light-mode',mode!=='dark');
    }
    return t;
  };
  window.mzApplyTheme();
  document.addEventListener('DOMContentLoaded',window.mzApplyTheme);
})();
</script>
