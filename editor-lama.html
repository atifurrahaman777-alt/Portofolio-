<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Code Editor | Mann'zz Tools</title>
<link rel="icon" type="image/png" href="icon-192.png?v=6">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{--bg:#0a0a0a;--card:#141414;--line:#2a2a2a;--text:#f5f5f5;--muted:#9ca3af;--accent:#f5f5f5;--on:#0a0a0a;--err:#ef4444;--warn:#f59e0b;--k:#c084fc;--s:#86efac;--n:#fbbf24;--c:#6b7280;--t:#60a5fa;--a:#f9a8d4;--d:#7dd3fc;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,sans-serif;display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
body.light-mode{--bg:#ffffff;--card:#f7f7f8;--line:#e5e5e5;--text:#0a0a0a;--muted:#6b7280;--accent:#0a0a0a;--on:#ffffff;--k:#7e22ce;--s:#15803d;--n:#b45309;--t:#1d4ed8;--a:#be185d;--d:#0369a1}
.top{display:flex;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--card)}
.seg{display:flex;flex:1;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;padding:9px;border:none;background:none;color:var(--muted);font:inherit;font-weight:800;cursor:pointer}
.seg button.on{background:var(--accent);color:var(--on)}
.btn{padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit;font-weight:800;cursor:pointer;white-space:nowrap}
.btn.pri{background:var(--accent);color:var(--on);border-color:var(--accent)}
.btn.warn{border-color:var(--err);color:var(--err)}
.view{display:none;flex:1;min-height:0;flex-direction:column}
.view.on{display:flex}
.ftabs{display:flex;align-items:center;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line);overflow-x:auto}
.ftabs button{flex:0 0 auto;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--muted);font:inherit;font-weight:800;cursor:pointer}
.ftabs button.on{background:var(--accent);color:var(--on);border-color:var(--accent)}
.ftabs .sp{flex:1}
#ed{flex:1;min-height:0;position:relative}
.CodeMirror{position:absolute;left:0;right:0;top:0;bottom:0;height:auto!important;background:var(--bg);color:var(--text);font:var(--fs,13px)/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.CodeMirror-gutters{background:var(--card);border-right:1px solid var(--line)}
.CodeMirror-linenumber{color:var(--muted)}
.CodeMirror-cursor{border-left:2px solid var(--text)}
.CodeMirror-selected{background:rgba(120,120,120,.35)!important}
.CodeMirror-matchingbracket{color:var(--text)!important;background:rgba(120,120,120,.35)}
.cm-s-default .cm-keyword{color:var(--k)}
.cm-s-default .cm-string,.cm-s-default .cm-string-2{color:var(--s)}
.cm-s-default .cm-number,.cm-s-default .cm-atom{color:var(--n)}
.cm-s-default .cm-comment{color:var(--c);font-style:italic}
.cm-s-default .cm-tag{color:var(--t)}
.cm-s-default .cm-attribute,.cm-s-default .cm-property{color:var(--a)}
.cm-s-default .cm-def,.cm-s-default .cm-variable-2,.cm-s-default .cm-builtin,.cm-s-default .cm-qualifier{color:var(--d)}
.cm-s-default .cm-variable,.cm-s-default .cm-bracket,.cm-s-default .cm-meta,.cm-s-default .cm-operator{color:var(--text)}
.keys,.tools{display:flex;gap:6px;padding:6px 10px;border-top:1px solid var(--line);overflow-x:auto;background:var(--card)}
.keys button{flex:0 0 auto;min-width:38px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:600 15px ui-monospace,Menlo,monospace;cursor:pointer}
.tools button{flex:1 0 auto}
#msg{margin:0;padding:0 12px 6px;font-size:.78rem;color:var(--muted);min-height:1.3em;background:var(--card)}
#frame{flex:1;min-height:0;width:100%;border:0;background:#fff}
.con{flex:0 0 30%;display:flex;flex-direction:column;border-top:1px solid var(--line);background:var(--card);min-height:90px}
.con-h{display:flex;justify-content:space-between;align-items:center;padding:6px 12px;font-size:.8rem}
.con-h button{background:none;border:none;color:var(--muted);font:inherit;font-weight:700;cursor:pointer}
#con{flex:1;overflow:auto;font:12px/1.5 ui-monospace,Menlo,monospace;padding:0 12px 8px}
.ln{padding:3px 0 3px 8px;border-left:3px solid var(--line);white-space:pre-wrap;word-break:break-word}
.ln.error{border-color:var(--err);color:var(--err)}
.ln.warn{border-color:var(--warn)}
.ln.info{border-color:#38bdf8}
.sheet{position:fixed;left:0;right:0;top:0;bottom:0;z-index:50;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet.off{display:none}
.panel{width:min(520px,100%);max-height:85%;overflow-y:auto;background:var(--card);border-radius:18px 18px 0 0;padding:16px;border:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.ph{display:flex;justify-content:space-between;align-items:center;font-size:1.05rem}
.ph button{background:none;border:none;color:var(--muted);font:inherit;font-weight:700;cursor:pointer}
.row{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--bg)}
.row .t{flex:1;min-width:0}
.row .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .t small{color:var(--muted)}
.in{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit}
</style>
</head>
<body>
<div class="top">
  <div class="seg" id="seg"><button type="button" class="on" data-v="kode">Kode</button><button type="button" data-v="hasil">Hasil</button></div>
  <button type="button" class="btn pri" id="run">&#9654; Jalankan</button>
</div>
<div id="v-kode" class="view on">
  <div class="ftabs" id="ftabs"><button type="button" class="on" data-f="html">HTML</button><button type="button" data-f="css">CSS</button><button type="button" data-f="js">JS</button><span class="sp"></span><button type="button" id="fm" aria-label="Perkecil huruf">A&minus;</button><button type="button" id="fp" aria-label="Perbesar huruf">A+</button></div>
  <div id="ed"></div>
  <div class="keys" id="keys"></div>
</div>
<div id="v-hasil" class="view">
  <iframe id="frame" sandbox="allow-scripts allow-modals allow-forms allow-popups" title="Hasil"></iframe>
  <div class="con"><div class="con-h"><b>Konsol</b><button type="button" id="conClear">Bersihkan</button></div><div id="con"></div></div>
</div>
<div class="tools" id="tools"><button type="button" class="btn" data-a="proyek">Proyek</button><button type="button" class="btn" data-a="contoh">Contoh</button><button type="button" class="btn" data-a="unduh">Unduh</button><button type="button" class="btn" data-a="salin">Salin</button><button type="button" class="btn" data-a="reset">Reset</button></div>
<p id="msg"></p>
<div class="sheet off" id="sheet"><div class="panel" id="panel"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/fold/xml-fold.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closetag.min.js"></script>
<script>
(function(){
  function sync(){
    try {
      var pb = window.parent !== window ? window.parent.document.body : null;
      if (pb) document.body.classList.toggle('light-mode', pb.classList.contains('light-mode'));
    } catch (e) {}
  }
  sync();
  window.addEventListener('load', sync);
  try { new MutationObserver(sync).observe(window.parent.document.body, { attributes: true, attributeFilter: ['class'] }); } catch (e) {}
})();
</script>
<script>
(function(){
  'use strict';
  var $ = function(id){ return document.getElementById(id); };
  var K = { d: 'mz_editor_draft', p: 'mz_editor_projects', f: 'mz_editor_fs' };
  var ls = {
    get: function(k){ try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: function(k, v){ try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }
  };
  var MODE = { html: 'htmlmixed', css: 'css', js: 'javascript' };

  var SAMPLES = [
    { n: 'Halo Dunia', d: 'Tombol yang mengubah judul',
      html: '<h1>Halo, Dunia!</h1>\n<p>Edit kode ini lalu tekan Jalankan.</p>\n<button id="btn">Klik aku</button>',
      css: 'body{font-family:system-ui,sans-serif;text-align:center;padding:40px;background:#0f172a;color:#e2e8f0}\nbutton{padding:12px 20px;border:0;border-radius:10px;background:#38bdf8;font-weight:700;font-size:1rem}',
      js: 'document.getElementById("btn").addEventListener("click", function(){\n  console.log("Tombol diklik!");\n  document.querySelector("h1").textContent = "Berhasil!";\n});' },
    { n: 'Kartu CSS', d: 'Kartu gradasi dengan efek sentuh',
      html: '<div class="card">\n  <h2>Kartu Keren</h2>\n  <p>Sentuh atau arahkan kursor ke sini.</p>\n</div>',
      css: 'body{display:grid;place-items:center;height:100vh;margin:0;background:#111;font-family:system-ui,sans-serif}\n.card{width:240px;padding:24px;border-radius:20px;color:#fff;background:linear-gradient(135deg,#f97316,#ec4899,#8b5cf6);transition:transform .3s}\n.card:hover,.card:active{transform:rotate(-3deg) scale(1.05)}\nh2{margin:0 0 8px}',
      js: '' },
    { n: 'Stopwatch', d: 'Hitung waktu dengan JavaScript',
      html: '<div id="t">0.0</div>\n<button id="go">Mulai</button>\n<button id="rs">Reset</button>',
      css: 'body{font-family:system-ui,sans-serif;text-align:center;padding-top:60px;background:#0b1020;color:#fff}\n#t{font-size:4rem;font-weight:800;margin-bottom:20px}\nbutton{padding:10px 18px;margin:4px;border:0;border-radius:10px;font-weight:700}',
      js: 'var timer = null, ms = 0;\nvar t = document.getElementById("t");\ndocument.getElementById("go").onclick = function(){\n  if (timer) { clearInterval(timer); timer = null; this.textContent = "Lanjut"; return; }\n  this.textContent = "Jeda";\n  timer = setInterval(function(){ ms += 100; t.textContent = (ms / 1000).toFixed(1); }, 100);\n};\ndocument.getElementById("rs").onclick = function(){\n  clearInterval(timer); timer = null; ms = 0; t.textContent = "0.0";\n  document.getElementById("go").textContent = "Mulai";\n  console.log("Direset");\n};' },
    { n: 'Daftar Tugas', d: 'Tambah dan hapus item',
      html: '<h2>Tugasku</h2>\n<input id="in" placeholder="Tulis tugas...">\n<button id="add">Tambah</button>\n<ul id="ls"></ul>',
      css: 'body{font-family:system-ui,sans-serif;max-width:420px;margin:30px auto;padding:0 16px}\ninput{padding:10px;border:1px solid #888;border-radius:8px}\nbutton{padding:10px 14px;border:0;border-radius:8px;background:#22c55e;color:#fff;font-weight:700}\nli{margin:8px 0;cursor:pointer}',
      js: 'var ls = document.getElementById("ls");\ndocument.getElementById("add").onclick = function(){\n  var i = document.getElementById("in");\n  if (!i.value.trim()) return;\n  var li = document.createElement("li");\n  li.textContent = i.value;\n  li.onclick = function(){ li.remove(); console.log("Dihapus"); };\n  ls.appendChild(li);\n  i.value = "";\n};' }
  ];

  var init = null;
  try { init = JSON.parse(ls.get(K.d) || 'null'); } catch (e) {}
  if (!init || typeof init.html !== 'string') init = SAMPLES[0];
  var docs = {
    html: CodeMirror.Doc(init.html || '', MODE.html),
    css: CodeMirror.Doc(String(init.css || ''), MODE.css),
    js: CodeMirror.Doc(String(init.js || ''), MODE.js)
  };
  var cur = 'html';
  var cm = CodeMirror($('ed'), {
    value: docs.html, lineNumbers: true, lineWrapping: true, tabSize: 2, indentUnit: 2,
    indentWithTabs: false, autoCloseBrackets: true, autoCloseTags: true, matchBrackets: true,
    extraKeys: { Tab: function(c){ c.execCommand('insertSoftTab'); } }
  });

  var fs = parseInt(ls.get(K.f), 10) || 13;
  function setFs(n){
    fs = Math.max(11, Math.min(22, n));
    $('ed').style.setProperty('--fs', fs + 'px');
    ls.set(K.f, String(fs));
    cm.refresh();
  }
  setFs(fs);
  $('fm').addEventListener('click', function(){ setFs(fs - 1); });
  $('fp').addEventListener('click', function(){ setFs(fs + 1); });

  function getCode(){ return { html: docs.html.getValue(), css: docs.css.getValue(), js: docs.js.getValue() }; }
  var tm = 0, dirty = true, lastCode = '';
  cm.on('change', function(){
    dirty = true;
    clearTimeout(tm); tm = setTimeout(function(){ ls.set(K.d, JSON.stringify(getCode())); }, 500);
  });
  function flushDraft(){ clearTimeout(tm); tm = 0; ls.set(K.d, JSON.stringify(getCode())); }
  window.addEventListener('pagehide', flushDraft);
  window.addEventListener('beforeunload', flushDraft);

  function setFile(f){
    cur = f;
    cm.swapDoc(docs[f]);
    $('ftabs').querySelectorAll('[data-f]').forEach(function(b){ b.classList.toggle('on', b.dataset.f === f); });
    cm.refresh();
  }
  $('ftabs').querySelectorAll('[data-f]').forEach(function(b){ b.addEventListener('click', function(){ setFile(b.dataset.f); }); });

  var mt = 0;
  function msg(t){
    $('msg').textContent = t || '';
    clearTimeout(mt);
    if (t) mt = setTimeout(function(){ $('msg').textContent = ''; }, 2600);
  }

  /* ----- Tombol simbol ----- */
  [['\u21B6', 'undo'], ['\u21B7', 'redo'], ['\u21E5', 'tab'], '<', '>', '/', '{', '}', '(', ')', '[', ']', '"', "'", '=', ';', ':', '.', '#', '!', '&', '|', '$', '_', '-', '+', '*'].forEach(function(k){
    var b = document.createElement('button');
    b.type = 'button';
    var label = typeof k === 'string' ? k : k[0];
    b.textContent = label;
    b.addEventListener('mousedown', function(e){ e.preventDefault(); });
    b.addEventListener('click', function(){
      if (typeof k !== 'string') {
        if (k[1] === 'undo') cm.undo();
        else if (k[1] === 'redo') cm.redo();
        else cm.execCommand('insertSoftTab');
      } else cm.replaceSelection(k);
      cm.focus();
    });
    $('keys').appendChild(b);
  });

  /* ----- Hasil dan konsol ----- */
  var BRIDGE = '<script>(function(){function s(t,a){try{parent.postMessage({mzc:1,t:t,m:a.map(function(x){try{return typeof x==="object"?JSON.stringify(x):String(x)}catch(e){return String(x)}}).join(" ")},"*")}catch(e){}}["log","info","warn","error"].forEach(function(k){var o=console[k];console[k]=function(){s(k,[].slice.call(arguments));try{o.apply(console,arguments)}catch(e){}}});window.addEventListener("error",function(e){s("error",[e.message+(e.lineno?" (baris "+e.lineno+")":"")])});window.addEventListener("unhandledrejection",function(e){s("error",["Promise ditolak: "+(e.reason&&e.reason.message||e.reason)])})})();<\/script>';
  function safeJs(js){ return js.replace(/<\/script/gi, '<\\/script'); }
  var stampN = 0;
  function build(c){
    return '<!doctype html><html><head><!--' + Date.now() + '-' + (++stampN) + '--><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">' + BRIDGE +
      '<style>' + c.css + '</style></head><body>' + c.html + '<script>' + safeJs(c.js) + '<\/script></body></html>';
  }
  function exportDoc(c){
    return '<!doctype html>\n<html lang="id">\n<head>\n<meta charset="UTF-8">\n<meta name="viewport" content="width=device-width,initial-scale=1">\n<title>Proyek</title>\n<style>\n' +
      c.css + '\n</style>\n</head>\n<body>\n' + c.html + '\n<script>\n' + safeJs(c.js) + '\n<\/script>\n</body>\n</html>\n';
  }
  var frame = $('frame');
  function addLog(t, m){
    var box = $('con');
    var l = document.createElement('div');
    l.className = 'ln ' + t;
    l.textContent = m;
    box.appendChild(l);
    while (box.children.length > 200) box.removeChild(box.firstChild);
    box.scrollTop = box.scrollHeight;
  }
  window.addEventListener('message', function(e){
    if (e.source !== frame.contentWindow) return;
    var d = e.data;
    if (!d || d.mzc !== 1) return;
    addLog(String(d.t), String(d.m).slice(0, 2000));
  });
  $('conClear').addEventListener('click', function(){ $('con').textContent = ''; });
  function render(force){
    var c = getCode(), key = JSON.stringify(c);
    if (!force && !dirty) return; // kode belum berubah: jangan muat ulang pratinjau
    if (!force && key === lastCode) { dirty = false; return; }
    lastCode = key;
    dirty = false;
    $('con').textContent = '';
    frame.srcdoc = build(c);
  }
  function view(v, force){
    ['kode', 'hasil'].forEach(function(x){ $('v-' + x).classList.toggle('on', x === v); });
    $('seg').querySelectorAll('[data-v]').forEach(function(b){ b.classList.toggle('on', b.dataset.v === v); });
    if (v === 'hasil') render(force); else cm.refresh();
  }
  $('seg').querySelectorAll('[data-v]').forEach(function(b){ b.addEventListener('click', function(){ view(b.dataset.v); }); });
  $('run').addEventListener('click', function(){ view('hasil', true); });

  /* ----- Panel bawah ----- */
  function closeSheet(){ $('sheet').classList.add('off'); }
  $('sheet').addEventListener('click', function(e){ if (e.target === this) closeSheet(); });
  function openSheet(title, fill){
    var p = $('panel');
    p.textContent = '';
    var h = document.createElement('div');
    h.className = 'ph';
    var b = document.createElement('b');
    b.textContent = title;
    var x = document.createElement('button');
    x.type = 'button';
    x.textContent = 'Tutup';
    x.addEventListener('click', closeSheet);
    h.append(b, x);
    p.appendChild(h);
    fill(p);
    $('sheet').classList.remove('off');
  }
  function armed(btn, hint, fn){
    var orig = btn.textContent, on = false, t = 0;
    function off(){ on = false; btn.textContent = orig; btn.classList.remove('warn'); }
    btn.addEventListener('click', function(){
      if (!on) { on = true; btn.textContent = hint; btn.classList.add('warn'); t = setTimeout(off, 3000); return; }
      clearTimeout(t);
      off();
      fn();
    });
  }
  function loadCode(c){
    docs.html.setValue(c.html || '');
    docs.css.setValue(c.css || '');
    docs.js.setValue(c.js || '');
    docs.html.clearHistory();
    docs.css.clearHistory();
    docs.js.clearHistory();
    setFile('html');
    ls.set(K.d, JSON.stringify(getCode()));
  }
  function projects(){
    try { var a = JSON.parse(ls.get(K.p) || '[]'); return Array.isArray(a) ? a : []; } catch (e) { return []; }
  }
  function openProjects(){
    openSheet('Proyek tersimpan', function(p){
      var name = document.createElement('input');
      name.className = 'in';
      name.maxLength = 40;
      name.placeholder = 'Nama proyek';
      name.value = 'Proyek ' + (projects().length + 1);
      var save = document.createElement('button');
      save.type = 'button';
      save.className = 'btn pri';
      save.textContent = 'Simpan kode saat ini';
      save.addEventListener('click', function(){
        var n = name.value.trim().slice(0, 40) || 'Tanpa nama';
        var c = getCode();
        var all = projects();
        all.unshift({ id: Date.now().toString(36), name: n, ts: Date.now(), html: c.html, css: c.css, js: c.js });
        all = all.slice(0, 20);
        if (!ls.set(K.p, JSON.stringify(all))) { msg('Penyimpanan penuh atau diblokir browser.'); return; }
        msg('Proyek disimpan.');
        openProjects();
      });
      p.append(name, save);
      var list = projects();
      if (!list.length) {
        var empty = document.createElement('div');
        empty.className = 'row';
        empty.textContent = 'Belum ada proyek tersimpan.';
        p.appendChild(empty);
      }
      list.forEach(function(it){
        var row = document.createElement('div');
        row.className = 'row';
        var t = document.createElement('div');
        t.className = 't';
        var b = document.createElement('b');
        b.textContent = it.name;
        var s = document.createElement('small');
        s.textContent = new Date(it.ts).toLocaleString('id-ID', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
        t.append(b, s);
        var op = document.createElement('button');
        op.type = 'button';
        op.className = 'btn';
        op.textContent = 'Buka';
        armed(op, 'Ganti kode?', function(){ loadCode(it); closeSheet(); msg('Proyek dibuka.'); });
        var del = document.createElement('button');
        del.type = 'button';
        del.className = 'btn';
        del.textContent = 'Hapus';
        armed(del, 'Yakin?', function(){
          ls.set(K.p, JSON.stringify(projects().filter(function(x){ return x.id !== it.id; })));
          openProjects();
        });
        row.append(t, op, del);
        p.appendChild(row);
      });
    });
  }
  function openSamples(){
    openSheet('Contoh kode', function(p){
      SAMPLES.forEach(function(sm){
        var row = document.createElement('div');
        row.className = 'row';
        var t = document.createElement('div');
        t.className = 't';
        var b = document.createElement('b');
        b.textContent = sm.n;
        var s = document.createElement('small');
        s.textContent = sm.d;
        t.append(b, s);
        var use = document.createElement('button');
        use.type = 'button';
        use.className = 'btn';
        use.textContent = 'Pakai';
        armed(use, 'Ganti kode?', function(){ loadCode(sm); closeSheet(); msg('Contoh dimuat.'); });
        row.append(t, use);
        p.appendChild(row);
      });
    });
  }

  /* ----- Unduh, salin, reset ----- */
  function download(){
    var url = URL.createObjectURL(new Blob([exportDoc(getCode())], { type: 'text/html' }));
    var a = document.createElement('a');
    a.href = url;
    a.download = 'proyek.html';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 3000);
    msg('Mengunduh proyek.html...');
  }
  function copyAll(){
    var text = exportDoc(getCode());
    function fb(){
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) {}
      ta.remove();
      msg(ok ? 'Kode disalin.' : 'Gagal menyalin.');
    }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function(){ msg('Kode disalin.'); }, fb);
    else fb();
  }
  armed($('tools').querySelector('[data-a="reset"]'), 'Yakin hapus semua?', function(){ loadCode({ html: '', css: '', js: '' }); msg('Kode dikosongkan.'); });
  $('tools').querySelectorAll('[data-a]').forEach(function(b){
    var a = b.dataset.a;
    if (a === 'reset') return;
    b.addEventListener('click', function(){
      if (a === 'proyek') openProjects();
      else if (a === 'contoh') openSamples();
      else if (a === 'unduh') download();
      else if (a === 'salin') copyAll();
    });
  });
})();
</script>
<script src="editor-pro.js?v=2"></script>
