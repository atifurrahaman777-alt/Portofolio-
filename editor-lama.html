<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<title>Code Editor | Mann'zz Tools</title>
<link rel="icon" type="image/png" href="icon-192.png?v=18">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="/pro.css?v=18">
</head>
<body>
<div class="top">
  <div class="seg" id="seg"><button type="button" class="on" data-v="kode">Kode</button><button type="button" data-v="hasil">Hasil</button></div>
  <button type="button" class="btn pri" id="run">&#9654; Jalankan</button>
</div>
<div id="v-kode" class="view on">
  <div class="ftabs" id="ftabs"><button type="button" class="on" data-f="html">HTML</button><button type="button" data-f="css">CSS</button><button type="button" data-f="js">JS</button><span class="sp"></span><button type="button" id="fm" aria-label="Perkecil huruf">A&minus;</button><button type="button" id="fp" aria-label="Perbesar huruf">A+</button></div>
  <div id="ed"></div>
  <div class="keys" id="keys"></div>
</div>
<div id="v-hasil" class="view">
  <iframe id="frame" sandbox="allow-scripts allow-modals allow-forms allow-popups" title="Hasil"></iframe>
  <div class="con"><div class="con-h"><b>Konsol</b><button type="button" id="conClear">Bersihkan</button></div><div id="con"></div></div>
</div>
<div class="tools" id="tools"><button type="button" class="btn" data-a="proyek">Proyek</button><button type="button" class="btn" data-a="contoh">Contoh</button><button type="button" class="btn" data-a="unduh">Unduh</button><button type="button" class="btn" data-a="salin">Salin</button><button type="button" class="btn" data-a="reset">Reset</button></div>
<p id="msg"></p>
<div class="sheet off" id="sheet"><div class="panel" id="panel"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/fold/xml-fold.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closetag.min.js"></script>
<script>
(function(){
  function sync(){
    try {
      var pb = window.parent !== window ? window.parent.document.body : null;
      if (pb) document.body.classList.toggle('light-mode', pb.classList.contains('light-mode'));
    } catch (e) {}
  }
  sync();
  window.addEventListener('load', sync);
  try { new MutationObserver(sync).observe(window.parent.document.body, { attributes: true, attributeFilter: ['class'] }); } catch (e) {}
})();
</script>
<script>
(function(){
  'use strict';
  var $ = function(id){ return document.getElementById(id); };
  var K = { d: 'mz_editor_draft', p: 'mz_editor_projects', f: 'mz_editor_fs' };
  var ls = {
    get: function(k){ try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: function(k, v){ try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }
  };
  var MODE = { html: 'htmlmixed', css: 'css', js: 'javascript' };

  var SAMPLES = [
    { n: 'Halo Dunia', d: 'Tombol yang mengubah judul',
      html: '<h1>Halo, Dunia!</h1>\n<p>Edit kode ini lalu tekan Jalankan.</p>\n<button id="btn">Klik aku</button>',
      css: 'body{font-family:system-ui,sans-serif;text-align:center;padding:40px;background:var(--ui-surface-2);color:var(--ui-info)}\nbutton{padding:12px 20px;border:0;border-radius:10px;background:var(--ui-info);font-weight:700;font-size:1rem}',
      js: 'document.getElementById("btn").addEventListener("click", function(){\n  console.log("Tombol diklik!");\n  document.querySelector("h1").textContent = "Berhasil!";\n});' },
    { n: 'Kartu CSS', d: 'Kartu gradasi dengan efek sentuh',
      html: '<div class="card">\n  <h2>Kartu Keren</h2>\n  <p>Sentuh atau arahkan kursor ke sini.</p>\n</div>',
      css: 'body{display:grid;place-items:center;height:100vh;margin:0;background:var(--ui-surface-2);font-family:system-ui,sans-serif}\n.card{width:240px;padding:24px;border-radius:20px;color:var(--ui-text);background:linear-gradient(135deg,var(--ui-warning),var(--ui-accent-bg),var(--ui-info));transition:transform .3s}\n.card:hover,.card:active{transform:rotate(-3deg) scale(1.05)}\nh2{margin:0 0 8px}',
      js: '' },
    { n: 'Stopwatch', d: 'Hitung waktu dengan JavaScript',
      html: '<div id="t" class="tabular-nums">0.0</div>\n<button id="go">Mulai</button>\n<button id="rs">Reset</button>',
      css: 'body{font-family:system-ui,sans-serif;text-align:center;padding-top:60px;background:var(--ui-surface-2);color:var(--ui-text)}\n#t{font-size:4rem;font-weight:800;margin-bottom:20px}\nbutton{padding:10px 18px;margin:4px;border:0;border-radius:10px;font-weight:700}',
      js: 'var timer = null, ms = 0;\nvar t = document.getElementById("t");\ndocument.getElementById("go").onclick = function(){\n  if (timer) { clearInterval(timer); timer = null; this.textContent = "Lanjut"; return; }\n  this.textContent = "Jeda";\n  timer = setInterval(function(){ ms += 100; t.textContent = (ms / 1000).toFixed(1); }, 100);\n};\ndocument.getElementById("rs").onclick = function(){\n  clearInterval(timer); timer = null; ms = 0; t.textContent = "0.0";\n  document.getElementById("go").textContent = "Mulai";\n  console.log("Direset");\n};' },
    { n: 'Daftar Tugas', d: 'Tambah dan hapus item',
      html: '<h2>Tugasku</h2>\n<input id="in" placeholder="Tulis tugas..." aria-label="Tulis tugas">\n<button id="add">Tambah</button>\n<ul id="ls"></ul>',
      css: 'body{font-family:system-ui,sans-serif;max-width:420px;margin:30px auto;padding:0 16px}\ninput{padding:10px;border:1px solid var(--ui-border);border-radius:8px}\nbutton{padding:10px 14px;border:0;border-radius:8px;background:var(--ui-success);color:var(--ui-ink);font-weight:700}\nli{margin:8px 0;cursor:pointer}',
      js: 'var ls = document.getElementById("ls");\ndocument.getElementById("add").onclick = function(){\n  var i = document.getElementById("in");\n  if (!i.value.trim()) return;\n  var li = document.createElement("li");\n  li.textContent = i.value;\n  li.onclick = function(){ li.remove(); console.log("Dihapus"); };\n  ls.appendChild(li);\n  i.value = "";\n};' }
  ];

  var init = null;
  try { init = JSON.parse(ls.get(K.d) || 'null'); } catch (e) {}
  if (!init || typeof init.html !== 'string') init = SAMPLES[0];
  var docs = {
    html: CodeMirror.Doc(init.html || '', MODE.html),
    css: CodeMirror.Doc(String(init.css || ''), MODE.css),
    js: CodeMirror.Doc(String(init.js || ''), MODE.js)
  };
  var cur = 'html';
  var cm = CodeMirror($('ed'), {
    value: docs.html, lineNumbers: true, lineWrapping: true, tabSize: 2, indentUnit: 2,
    indentWithTabs: false, autoCloseBrackets: true, autoCloseTags: true, matchBrackets: true,
    extraKeys: { Tab: function(c){ c.execCommand('insertSoftTab'); } }
  });

  var fs = parseInt(ls.get(K.f), 10) || 13;
  function setFs(n){
    fs = Math.max(11, Math.min(22, n));
    $('ed').style.setProperty('--fs', fs + 'px');
    ls.set(K.f, String(fs));
    cm.refresh();
  }
  setFs(fs);
  $('fm').addEventListener('click', function(){ setFs(fs - 1); });
  $('fp').addEventListener('click', function(){ setFs(fs + 1); });

  function getCode(){ return { html: docs.html.getValue(), css: docs.css.getValue(), js: docs.js.getValue() }; }
  var tm = 0, dirty = true, lastCode = '';
  cm.on('change', function(){
    dirty = true;
    clearTimeout(tm); tm = setTimeout(function(){ ls.set(K.d, JSON.stringify(getCode())); }, 500);
  });
  function flushDraft(){ clearTimeout(tm); tm = 0; ls.set(K.d, JSON.stringify(getCode())); }
  window.addEventListener('pagehide', flushDraft);
  window.addEventListener('beforeunload', flushDraft);

  function setFile(f){
    cur = f;
    cm.swapDoc(docs[f]);
    $('ftabs').querySelectorAll('[data-f]').forEach(function(b){ b.classList.toggle('on', b.dataset.f === f); });
    cm.refresh();
  }
  $('ftabs').querySelectorAll('[data-f]').forEach(function(b){ b.addEventListener('click', function(){ setFile(b.dataset.f); }); });

  var mt = 0;
  function msg(t){
    $('msg').textContent = t || '';
    clearTimeout(mt);
    if (t) mt = setTimeout(function(){ $('msg').textContent = ''; }, 2600);
  }

  /* ----- Tombol simbol ----- */
  [['\u21B6', 'undo'], ['\u21B7', 'redo'], ['\u21E5', 'tab'], '<', '>', '/', '{', '}', '(', ')', '[', ']', '"', "'", '=', ';', ':', '.', '#', '!', '&', '|', '$', '_', '-', '+', '*'].forEach(function(k){
    var b = document.createElement('button');
    b.type = 'button';
    var label = typeof k === 'string' ? k : k[0];
    b.textContent = label;
    b.addEventListener('mousedown', function(e){ e.preventDefault(); });
    b.addEventListener('click', function(){
      if (typeof k !== 'string') {
        if (k[1] === 'undo') cm.undo();
        else if (k[1] === 'redo') cm.redo();
        else cm.execCommand('insertSoftTab');
      } else cm.replaceSelection(k);
      cm.focus();
    });
    $('keys').appendChild(b);
  });

  /* ----- Hasil dan konsol ----- */
  var BRIDGE = '<script>(function(){function s(t,a){try{parent.postMessage({mzc:1,t:t,m:a.map(function(x){try{return typeof x==="object"?JSON.stringify(x):String(x)}catch(e){return String(x)}}).join(" ")},"*")}catch(e){}}["log","info","warn","error"].forEach(function(k){var o=console[k];console[k]=function(){s(k,[].slice.call(arguments));try{o.apply(console,arguments)}catch(e){}}});window.addEventListener("error",function(e){s("error",[e.message+(e.lineno?" (baris "+e.lineno+")":"")])});window.addEventListener("unhandledrejection",function(e){s("error",["Promise ditolak: "+(e.reason&&e.reason.message||e.reason)])})})();<\/script>';
  function safeJs(js){ return js.replace(/<\/script/gi, '<\\/script'); }
var UNSLOP_IFRAME_TOKENS = ':root{--ui-canvas:#08090a;--ui-surface:#0f1011;--ui-surface-2:#161719;--ui-ink:#08090a;--ui-on-accent:#08090a;--ui-text:#f7f8f8;--ui-text-muted:#b0b5c0;--ui-border:rgba(255,255,255,.14);--ui-accent:#a5aaff;--ui-accent-bg:#a5aaff;--ui-success:#4cb782;--ui-success-text:#55d39a;--ui-warning:#d7a642;--ui-danger:#ff8a8a;--ui-danger-text:#ff8a8a;--ui-info:#93c5fd;--bg:var(--ui-canvas);--card:var(--ui-surface-2);--line:var(--ui-border);--text:var(--ui-text);--txt:var(--ui-text);--muted:var(--ui-text-muted);--mut:var(--ui-text-muted);--on:var(--ui-on-accent);--accent:var(--ui-accent);--gold:var(--ui-warning);--err:var(--ui-danger)}';
  var stampN = 0;
  function build(c){
    return '<!doctype html><html><head><!--' + Date.now() + '-' + (++stampN) + '--><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">' + BRIDGE +
      '<style>' + UNSLOP_IFRAME_TOKENS + c.css + '</style></head><body>' + c.html + '<script>' + safeJs(c.js) + '<\/script></body></html>';
  }
  function exportDoc(c){
    return '<!doctype html>\n<html lang="id">\n<head>\n<meta charset="UTF-8">\n<meta name="viewport" content="width=device-width,initial-scale=1">\n<title>Proyek</title>\n<style>\n' +
      UNSLOP_IFRAME_TOKENS + '\n' + c.css + '\n</style>\n</head>\n<body>\n' + c.html + '\n<script>\n' + safeJs(c.js) + '\n<\/script>\n</body>\n</html>\n';
  }
  var frame = $('frame');
  function addLog(t, m){
    var box = $('con');
    var l = document.createElement('div');
    l.className = 'ln ' + t;
    l.textContent = m;
    box.appendChild(l);
    while (box.children.length > 200) box.removeChild(box.firstChild);
    box.scrollTop = box.scrollHeight;
  }
  window.addEventListener('message', function(e){
    if (e.source !== frame.contentWindow) return;
    var d = e.data;
    if (!d || d.mzc !== 1) return;
    addLog(String(d.t), String(d.m).slice(0, 2000));
  });
  $('conClear').addEventListener('click', function(){ $('con').textContent = ''; });
  function render(force){
    var c = getCode(), key = JSON.stringify(c);
    if (!force && !dirty) return; // kode belum berubah: jangan muat ulang pratinjau
    if (!force && key === lastCode) { dirty = false; return; }
    lastCode = key;
    dirty = false;
    $('con').textContent = '';
    frame.srcdoc = build(c);
  }
  function view(v, force){
    ['kode', 'hasil'].forEach(function(x){ $('v-' + x).classList.toggle('on', x === v); });
    $('seg').querySelectorAll('[data-v]').forEach(function(b){ b.classList.toggle('on', b.dataset.v === v); });
    if (v === 'hasil') render(force); else cm.refresh();
  }
  $('seg').querySelectorAll('[data-v]').forEach(function(b){ b.addEventListener('click', function(){ view(b.dataset.v); }); });
  $('run').addEventListener('click', function(){ view('hasil', true); });

  /* ----- Panel bawah ----- */
  function closeSheet(){ $('sheet').classList.add('off'); }
  $('sheet').addEventListener('click', function(e){ if (e.target === this) closeSheet(); });
  function openSheet(title, fill){
    var p = $('panel');
    p.textContent = '';
    var h = document.createElement('div');
    h.className = 'ph';
    var b = document.createElement('b');
    b.textContent = title;
    var x = document.createElement('button');
    x.type = 'button';
    x.textContent = 'Tutup';
    x.addEventListener('click', closeSheet);
    h.append(b, x);
    p.appendChild(h);
    fill(p);
    $('sheet').classList.remove('off');
  }
  function armed(btn, hint, fn){
    var orig = btn.textContent, on = false, t = 0;
    function off(){ on = false; btn.textContent = orig; btn.classList.remove('warn'); }
    btn.addEventListener('click', function(){
      if (!on) { on = true; btn.textContent = hint; btn.classList.add('warn'); t = setTimeout(off, 3000); return; }
      clearTimeout(t);
      off();
      fn();
    });
  }
  function loadCode(c){
    docs.html.setValue(c.html || '');
    docs.css.setValue(c.css || '');
    docs.js.setValue(c.js || '');
    docs.html.clearHistory();
    docs.css.clearHistory();
    docs.js.clearHistory();
    setFile('html');
    ls.set(K.d, JSON.stringify(getCode()));
  }
  function projects(){
    try { var a = JSON.parse(ls.get(K.p) || '[]'); return Array.isArray(a) ? a : []; } catch (e) { return []; }
  }
  function openProjects(){
    openSheet('Proyek tersimpan', function(p){
      var name = document.createElement('input');
      name.className = 'in';
      name.maxLength = 40;
      name.placeholder = 'Nama proyek';
      name.value = 'Proyek ' + (projects().length + 1);
      var save = document.createElement('button');
      save.type = 'button';
      save.className = 'btn pri';
      save.textContent = 'Simpan kode saat ini';
      save.addEventListener('click', function(){
        var n = name.value.trim().slice(0, 40) || 'Tanpa nama';
        var c = getCode();
        var all = projects();
        all.unshift({ id: Date.now().toString(36), name: n, ts: Date.now(), html: c.html, css: c.css, js: c.js });
        all = all.slice(0, 20);
        if (!ls.set(K.p, JSON.stringify(all))) { msg('Penyimpanan penuh atau diblokir browser.'); return; }
        msg('Proyek disimpan.');
        openProjects();
      });
      p.append(name, save);
      var list = projects();
      if (!list.length) {
        var empty = document.createElement('div');
        empty.className = 'row';
        empty.textContent = 'Belum ada proyek tersimpan.';
        p.appendChild(empty);
      }
      list.forEach(function(it){
        var row = document.createElement('div');
        row.className = 'row';
        var t = document.createElement('div');
        t.className = 't';
        var b = document.createElement('b');
        b.textContent = it.name;
        var s = document.createElement('small');
        s.textContent = new Date(it.ts).toLocaleString('id-ID', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
        t.append(b, s);
        var op = document.createElement('button');
        op.type = 'button';
        op.className = 'btn';
        op.textContent = 'Buka';
        armed(op, 'Ganti kode?', function(){ loadCode(it); closeSheet(); msg('Proyek dibuka.'); });
        var del = document.createElement('button');
        del.type = 'button';
        del.className = 'btn';
        del.textContent = 'Hapus';
        armed(del, 'Yakin?', function(){
          ls.set(K.p, JSON.stringify(projects().filter(function(x){ return x.id !== it.id; })));
          openProjects();
        });
        row.append(t, op, del);
        p.appendChild(row);
      });
    });
  }
  function openSamples(){
    openSheet('Contoh kode', function(p){
      SAMPLES.forEach(function(sm){
        var row = document.createElement('div');
        row.className = 'row';
        var t = document.createElement('div');
        t.className = 't';
        var b = document.createElement('b');
        b.textContent = sm.n;
        var s = document.createElement('small');
        s.textContent = sm.d;
        t.append(b, s);
        var use = document.createElement('button');
        use.type = 'button';
        use.className = 'btn';
        use.textContent = 'Pakai';
        armed(use, 'Ganti kode?', function(){ loadCode(sm); closeSheet(); msg('Contoh dimuat.'); });
        row.append(t, use);
        p.appendChild(row);
      });
    });
  }

  /* ----- Unduh, salin, reset ----- */
  function download(){
    var url = URL.createObjectURL(new Blob([exportDoc(getCode())], { type: 'text/html' }));
    var a = document.createElement('a');
    a.href = url;
    a.download = 'proyek.html';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 3000);
    msg('Mengunduh proyek.html...');
  }
  function copyAll(){
    var text = exportDoc(getCode());
    function fb(){
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) {}
      ta.remove();
      msg(ok ? 'Kode disalin.' : 'Gagal menyalin.');
    }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function(){ msg('Kode disalin.'); }, fb);
    else fb();
  }
  armed($('tools').querySelector('[data-a="reset"]'), 'Yakin hapus semua?', function(){ loadCode({ html: '', css: '', js: '' }); msg('Kode dikosongkan.'); });
  $('tools').querySelectorAll('[data-a]').forEach(function(b){
    var a = b.dataset.a;
    if (a === 'reset') return;
    b.addEventListener('click', function(){
      if (a === 'proyek') openProjects();
      else if (a === 'contoh') openSamples();
      else if (a === 'unduh') download();
      else if (a === 'salin') copyAll();
    });
  });
})();
</script>
<script src="editor-pro.js?v=18"></script>

<style id="mz-design-system">
/* ==========================================================================
   Sistem desain profesional — satu sumber kebenaran untuk seluruh halaman.
   Prinsip: tenang, konsisten, hierarki jelas, aksen hemat.
   ========================================================================== */

/* --- Token -------------------------------------------------------------- */
:root {
  color-scheme: light;
  --ui-canvas:#f7f8fa; --ui-surface:#ffffff; --ui-surface-2:#f1f3f6;
  --ui-ink:#111827; --ui-text:#111827; --ui-text-muted:#64748b;
  --ui-border:#e2e8f0; --ui-accent:#2563eb; --ui-accent-bg:#2563eb;
  --ui-on-accent:#ffffff; --ui-success:#15803d; --ui-warning:#b45309;
  --ui-danger:#b91c1c; --ui-info:#2563eb;
  --ui-radius:10px; --ui-shadow:0 1px 2px rgba(15,23,42,.06);
  --ui-overlay:rgba(15,23,42,.48);
  --ui-font-body:"Inter","Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --ui-font-mono:ui-monospace,"SFMono-Regular",Consolas,monospace;

  --bg:var(--ui-canvas); --bg2:var(--ui-surface); --card:var(--ui-surface);
  --card-2:var(--ui-surface-2); --panel:var(--ui-surface); --inp:var(--ui-surface);
  --line:var(--ui-border); --text:var(--ui-text); --txt:var(--ui-text);
  --head:var(--ui-text); --muted:var(--ui-text-muted); --mut:var(--ui-text-muted);
  --accent:var(--ui-accent); --acc:var(--ui-accent);
  --brand:var(--ui-accent); --brand-hover:var(--ui-accent-bg);
  --gold:var(--ui-warning); --warn:var(--ui-warning); --err:var(--ui-danger);
  --purple:var(--ui-accent); --black:var(--ui-ink); --on:var(--ui-on-accent);
  --shadow:var(--ui-border); --radius:var(--ui-radius);
  --code-strong:var(--ui-text); --code-mid:var(--ui-text);
  --code-dim:var(--ui-text-muted);
  --sh-card:var(--ui-surface); --sh-card-foreground:var(--ui-text);
  --sh-border:var(--ui-border); --sh-input:var(--ui-surface);
  --sh-primary:var(--ui-accent); --sh-ring:var(--ui-accent);
  --sp:var(--ui-accent); --sp-d:var(--ui-accent); --sp-ink:var(--ui-on-accent);
}

/* Tema: seluruh permukaan ikut berubah, tetap proporsional. */
html[data-mz-accent="biru"],html[data-mz-accent="biru"] body {
  --ui-canvas:#eff6ff; --ui-surface:#ffffff; --ui-surface-2:#dbeafe;
  --ui-ink:#0f172a; --ui-text:#0f172a; --ui-text-muted:#475569;

/* --- Dasar -------------------------------------------------------------- */
*,*::before,*::after { box-sizing:border-box; }
html { scroll-behavior:smooth; }
body {
  margin:0; min-height:100vh; background:var(--ui-canvas); color:var(--ui-text);
  font:15px/1.65 var(--ui-font-body); -webkit-font-smoothing:antialiased;
}
body.mz-lock,body.mz-sheetlock,body.mz-musiclock { overflow:hidden; }
html.mz-musiclock,html.mz-musiclock body { overflow:hidden; }
a { color:inherit; text-decoration:none; }
img { max-width:100%; display:block; }
button,input,select,textarea { font:inherit; color:inherit; }
button { cursor:pointer; }
button:disabled,input:disabled,select:disabled,textarea:disabled { opacity:.5; cursor:not-allowed; }
:is(a,button,input,select,textarea,[role="button"]):focus-visible {
  outline:2px solid var(--ui-accent); outline-offset:2px;
}
h1,h2,h3,h4 { font-weight:700; letter-spacing:-.02em; line-height:1.2; margin:0 0 12px; }
h1 { font-size:clamp(1.7rem,4vw,2.4rem); }
h2 { font-size:clamp(1.3rem,3vw,1.75rem); }
h3 { font-size:1.05rem; }
h4 { font-size:.95rem; }
p { margin:0 0 12px; }
[hidden] { display:none!important; }
.tabular-nums { font-variant-numeric:tabular-nums; }

/* --- Tata letak --------------------------------------------------------- */
.wrap,.container { width:min(1080px,calc(100% - 32px)); margin:0 auto; padding:28px 0 64px; }
.grid,.projects { display:grid; gap:16px; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); }
.app { padding:20px 16px 92px; }
.tab { display:none; }
.tab.active { display:block; animation:sgFade .24s ease; }
@keyframes sgFade { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:none} }
.ocean-view { display:none; }
.ocean-view.active { display:block; }
.show { display:block!important; }

/* --- Permukaan ---------------------------------------------------------- */
.card,.panel,.about-card,.security-card,.email-card,.profile-card,.tool-card,
.project,.skill,.quote,.game-box,.dl-box,.rc-box,.tm-box,.amfind-result,
.email-section,.contact-block,.pf-info,.pf-sheet-panel,.ttt-board,.mem-grid,

}
.card,.panel { margin-bottom:16px; }
.hero { border-left:3px solid var(--ui-accent); }
.banner { display:flex; align-items:center; justify-content:space-between;

.banner-icon { width:42px; height:42px; flex:none; display:flex; align-items:center;

.eyebrow,.about-kicker,.email-kicker,.label,.tm-label,.mz-now-label {

.accent { color:var(--ui-accent); }

/* --- Tombol & input ----------------------------------------------------- */

.auth-tab,.ocean-tab,.dl-tab,.game-controls button,#theme-toggle,#auth-toggle {

input,select,textarea,.input-field,.dl-paste {

.pill,.tag,.platform-chip,.pf-chip,.owner-badge {

}
.spinner { width:20px; height:20px; border:2px solid var(--ui-surface-2);

@keyframes sgSpin { to{transform:rotate(360deg)} }
.is-loading { opacity:.6; pointer-events:none; }
.off { opacity:.45; pointer-events:none; }
.error,.gate-error,.dl-error,.rc-error,.tm-error { color:var(--ui-danger); font-weight:600; }
.correct { color:var(--ui-success); font-weight:700; }

.sidebar-overlay { position:fixed; inset:0; z-index:80; background:var(--ui-overlay); display:none; }

.sidebar { position:fixed; left:0; top:0; bottom:0; z-index:90; width:min(320px,86vw);

/* Badge avatar — satu aturan untuk semua varian. */
[class*="bd-a-"] { position:relative; isolation:isolate; }
[class*="bd-a-"]::before,[class*="bd-a-"]::after { position:absolute; z-index:2;
  line-height:1; pointer-events:none; font-size:calc(var(--sz,40px) * .42); }
.bd-a-bunga::before { content:'✿'; top:-14%; right:-14%; color:var(--ui-accent); }
.bd-a-bintang::before { content:'★'; top:-14%; right:-14%; color:var(--ui-warning); }
.bd-a-hati::before { content:'♥'; top:-14%; right:-14%; color:var(--ui-danger); }
.bd-a-pita::before { content:'◆'; top:-16%; left:-14%; color:var(--ui-accent); }
.bd-a-mahkota::before { content:'♛'; top:-38%; left:50%; transform:translateX(-50%); color:var(--ui-warning); }
.bd-a-api::before { content:'▲'; top:-30%; left:50%; transform:translateX(-50%); color:var(--ui-accent); }
.bd-a-kilat::before { content:'⚡'; top:-14%; right:-14%; }
.bd-a-kucing::before,.bd-a-kucing::after { content:''; width:30%; height:30%;
  background:var(--ui-accent); clip-path:polygon(0 100%,50% 0,100% 100%); z-index:-1; }
.bd-a-kucing::before { top:-12%; left:4%; }
.bd-a-kucing::after { top:-12%; right:4%; }
.bd-a-tanduk::before,.bd-a-tanduk::after { content:''; width:24%; height:28%;
  background:var(--ui-danger); clip-path:polygon(0 100%,50% 0,100% 100%); z-index:-1; }
.bd-a-tanduk::before { top:-18%; left:6%; transform:rotate(-24deg); }
.bd-a-tanduk::after { top:-18%; right:6%; transform:rotate(24deg); }
.bd-a-halo::before { content:''; left:14%; right:14%; top:-24%; height:12%;
  border:2px solid var(--ui-warning); border-radius:50%; }
.bd-dot { width:38px; height:38px; --sz:38px; }

.pf-sheet-panel { position:fixed; inset:0; z-index:100; overflow:auto; padding:20px; }
.pf-sheet-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }

.mz-ly-in .mz-lyrics-body { animation:sgFade .3s ease; }
.mz-ly-live { color:var(--sp); font-weight:700; }
.mz-search-top { display:flex; gap:8px; align-items:center; }
.mz-search-body,.mz-search-wrap { margin-top:10px; }
.mz-chips,.mzs-chips { display:flex; gap:6px; flex-wrap:wrap; }
.mz-playbig { width:68px; height:68px; display:flex; align-items:center; justify-content:center;
  background:var(--sp); color:var(--sp-ink); border-radius:50%; }
.mz-tech-up { padding:12px; background:var(--ui-surface-2); border-radius:8px; }
.mz-rv { opacity:0; transform:translateY(18px); transition:opacity .5s ease,transform .5s ease; }
.mz-rv.mz-in { opacity:1; transform:none; }

/* --- Chat --------------------------------------------------------------- */
.gc { display:flex; flex-direction:column; height:100vh; height:100dvh; max-width:760px;
  margin:0 auto; background:var(--ui-canvas); color:var(--ui-text); }
.gc-head,.gc-bar { display:flex; align-items:center; gap:10px; padding:12px 16px;
  background:var(--ui-surface); border-bottom:1px solid var(--ui-border); }
.gc-head { position:sticky; top:0; z-index:20; }
.gc-title { font-weight:700; }
.gc-list { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
.gc-bub { max-width:min(85%,560px); padding:10px 14px; background:var(--ui-surface);
  border:1px solid var(--ui-border); border-radius:12px; }
.gc-row.me { align-self:flex-end; }
.gc-row.me .gc-bub { background:var(--ui-accent); color:var(--ui-on-accent); border-color:var(--ui-accent); }
.gc-strip { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.gc-dot,.gc-ib { width:8px; height:8px; background:var(--ui-accent); border-radius:50%; }
.gc-replybar,.gc-notes { padding:10px; border-top:1px solid var(--ui-border); background:var(--ui-surface); }
.rc-row,.tm-row { display:flex; gap:10px; align-items:center; margin-bottom:10px; flex-wrap:wrap; }
.rc-result,.tm-mail { padding:14px; background:var(--ui-surface);
  border:1px solid var(--ui-border); border-radius:8px; }
.tm-mail { width:100%; overflow-wrap:anywhere; }
.tm-head { display:flex; justify-content:space-between; align-items:center; gap:10px; }

/* --- Game --------------------------------------------------------------- */
.game-controls,.gm-row,.gm-top,.wam-top { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.ttt-board { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; max-width:340px; padding:12px; }
.ttt-cell { aspect-ratio:1; display:flex; align-items:center; justify-content:center;
  font-size:1.7rem; font-weight:700; background:var(--ui-surface-2);
  border:1px solid var(--ui-border); border-radius:8px; }
.mem-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; max-width:420px; padding:12px; }
.mem-card { aspect-ratio:1; display:flex; align-items:center; justify-content:center;
  background:var(--ui-surface-2); border:1px solid var(--ui-border); border-radius:8px; cursor:pointer; }
.wam-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; max-width:420px; padding:12px; }
.wam-hole { aspect-ratio:1; display:flex; align-items:center; justify-content:center;
  font-size:1.8rem; background:var(--ui-surface-2); border:1px solid var(--ui-border);
  border-radius:10px; cursor:pointer; }
.wam-hole.up { background:var(--ui-accent); color:var(--ui-on-accent); }
.g2048-board { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; max-width:380px; padding:12px; }
.g2048-board>div { display:flex; align-items:center; justify-content:center; aspect-ratio:1;
  font-weight:700; background:var(--ui-surface-2); border-radius:8px; }
.v2,.v4,.v8,.v16 { background:var(--ui-accent)!important; color:var(--ui-on-accent)!important; }
.wheel-pointer { width:0; height:0; border-left:9px solid transparent;
  border-right:9px solid transparent; border-top:16px solid var(--ui-accent); margin:0 auto; }
.rt-area { min-height:140px; }
.typing-text { font-family:var(--ui-font-mono); font-size:1rem; }
.dpad { display:grid; grid-template-columns:repeat(3,42px); gap:4px; justify-content:center; }
.gm-msg { font-weight:600; }
.up,.done { background:var(--ui-accent); color:var(--ui-on-accent); }
.typing-stats,.rt-stats { font:600 .8rem var(--ui-font-mono); color:var(--ui-text-muted); }

/* --- Downloader / email / editor ---------------------------------------- */
.dl-form,.rc-form { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:14px; }
.dl-form input,.rc-form input { flex:1; min-width:200px; }
.dl-formats,.platforms { display:flex; gap:8px; flex-wrap:wrap; }
.dl-result,.tm-body,.tm-raw,.amfind-result { margin-top:12px; }
.dl-download-panel { display:flex; gap:10px; flex-wrap:wrap; }
.dl-history { margin-top:18px; }
.email-grid { display:grid; gap:10px; }
.email-step { padding:12px; background:var(--ui-surface-2);
  border:1px solid var(--ui-border); border-radius:8px; font-weight:600; }
.email-step.active { background:var(--ui-accent); color:var(--ui-on-accent); border-color:var(--ui-accent); }
.email-step.completed { background:var(--ui-success); color:#fff; border-color:var(--ui-success); }
.email-step.failed { background:var(--ui-danger); color:#fff; border-color:var(--ui-danger); }
.status { display:inline-block; padding:5px 11px; background:var(--ui-accent);
  color:var(--ui-on-accent); border-radius:999px; font-size:.78rem; font-weight:600; }
.step-connector { display:grid; gap:8px; }

.con,.sheet,.view,.sf,.oh { background:var(--ui-surface); border:1px solid var(--ui-border);
  border-radius:10px; padding:16px; }
.sheet { min-height:300px; }
.top { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:12px; }
.tools,.keys,.con-h { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
.CodeMirror { height:340px; background:var(--ui-surface)!important; color:var(--ui-text)!important;
  border:1px solid var(--ui-border); font-family:var(--ui-font-mono); }
.CodeMirror-gutters { background:var(--ui-surface-2)!important; border-right:1px solid var(--ui-border)!important; }
.cm-s-default .cm-keyword,.cm-s-default .cm-def { color:var(--ui-accent)!important; font-weight:700; }
.cm-s-default .cm-string,.cm-s-default .cm-number { color:var(--ui-success)!important; }
.cm-s-default .cm-comment { color:var(--ui-text-muted)!important; }

/* --- Responsif & motion ------------------------------------------------- */
.flex { display:flex; }
.center { text-align:center; }
.full { width:100%; }
.no-margin { margin:0; }
.wam-top,.pf-prog-top { display:flex; justify-content:space-between; align-items:center; gap:10px; }
@media (min-width:768px) { .container { width:min(820px,92%); } }
@media (min-width:1100px) { .container { width:min(1080px,90%); } }
@media (min-width:1400px) { .container { width:min(1200px,88%); } }
@media (max-width:640px) {
  h1 { font-size:1.65rem; }
  .stat-row,.pf-stats,.pf-bd-grid,.pf-sw-grid { grid-template-columns:repeat(2,1fr); }
}
@media (prefers-reduced-motion:reduce) {
  *,*::before,*::after { scroll-behavior:auto!important; animation-duration:.01ms!important;
    animation-iteration-count:1!important; transition-duration:.01ms!important; }
}
