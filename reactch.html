<script>
const form = document.getElementById('rc-form');
const linkInput = document.getElementById('rc-link');
const emojiInput = document.getElementById('rc-emoji');
const submitBtn = document.getElementById('rc-submit');
const loading = document.getElementById('rc-loading');
const errorBox = document.getElementById('rc-error');
const result = document.getElementById('rc-result');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const link = linkInput.value.trim();
  const emoji = emojiInput.value.trim() || '❤️';
  if (!link) return;

  errorBox.classList.remove('show');
  result.classList.remove('show');
  loading.classList.add('show');
  submitBtn.disabled = true;

  try {
    const qs = new URLSearchParams({ link, emoji });
    const res = await fetch(`/api/reactch?${qs}`, { cache: 'no-store' });
    const raw = await res.text();
    let data;
    try { data = JSON.parse(raw); } catch { data = {}; }

    if (!res.ok || !data.success) {
      throw new Error(data.message || 'Gagal mengirim reaksi.');
    }

    document.getElementById('rc-message').textContent = `Pesan: ${data.message || '-'}`;
    document.getElementById('rc-target').textContent = `Target: ${data.target || link}`;
    document.getElementById('rc-emojis').textContent = `Emoji: ${Array.isArray(data.emojis) ? data.emojis.join(' ') : (data.emojis || emoji)}`;
    document.getElementById('rc-time').textContent = `Waktu: ${data.took_ms ?? '-'} ms`;
    result.classList.add('show');
  } catch (err) {
    errorBox.textContent = err.message || 'Terjadi kesalahan.';
    errorBox.classList.add('show');
  } finally {
    loading.classList.remove('show');
    submitBtn.disabled = false;
  }
});
</script>

  --ui-success-glow:rgba(17,17,17,.42);
  --ui-shadow:4px 4px 0 var(--ui-ink);

  --ui-font-body:Inter,"Helvetica Neue",Arial,sans-serif;
  --ui-font-mono:"IBM Plex Mono","SFMono-Regular",Consolas,monospace;

/* 3. Tampilan. Scope tunggal: menang atas CSS lama tanpa perang !important. */
html[data-theme-root] body{
  background:var(--ui-canvas);color:var(--ui-text);
  font-family:var(--ui-font-body);
}
html[data-theme-root] body :is(section,article,aside,header,footer,.card,.tool-card,.profile-card,
.email-card,.project,.skill,.panel,.mzs-panel,.mzm,.mz-sw,.mz-fo,.pf-card,
.mz-tech-up,.mz-lyrics,.banner,.gc-panel,.chat-card,.game-card,.editor-card,
.sidebar,.bottom-nav,.owner-panel,.auth-form,.quote,.contact-block,.pf-info,
.pf-prog,.pf-bd,.stat,.ttt-cell,.mem-card,.wam-hole,.sh-card){
  background:var(--ui-surface)!important;color:var(--ui-text)!important;
  border:2px solid var(--ui-ink)!important;border-radius:0!important;
  box-shadow:var(--ui-shadow)!important;
}
html[data-theme-root] body :is(button,.btn,.nav-btn,.pill,.mzs-btn,.mz-sw,.mz-fo,.sh-btn,
input,select,textarea,[role="button"]):not([type="range"]):not([type="checkbox"]):not([type="radio"]){
  background:var(--ui-surface-2)!important;color:var(--ui-text)!important;
  border:2px solid var(--ui-ink)!important;border-radius:0!important;
  box-shadow:3px 3px 0 var(--ui-ink)!important;font:inherit;
}
html[data-theme-root] body :is(.nav-btn.active,.btn.primary,.btn.pri,.gc-act,.gc-play,.mzs-btn.sel,
.auth-tab.active,.ocean-tab.active,.dl-tab.active,.email-step.active,
.game-controls button.active,.mzs-chips button.on,#run){
  background:var(--ui-accent)!important;color:var(--ui-on-accent)!important;
  -webkit-text-fill-color:var(--ui-on-accent)!important;
  border:2px solid var(--ui-ink)!important;border-radius:0!important;
  box-shadow:3px 3px 0 var(--ui-ink)!important;
}
html[data-theme-root] body :is(h1,h2,h3,h4,.brand,.logo,.title,.eyebrow,.banner-title,.profile-name,
.nav-btn,.btn,.mzs-head b,.mz-now-meta b){
  color:var(--ui-text)!important;-webkit-text-fill-color:var(--ui-text)!important;
  font-family:var(--ui-font-display)!important;font-weight:900!important;
  letter-spacing:-.03em!important;text-transform:uppercase;
}
html[data-theme-root] body :is(.sub,.muted,.profile-bio,.banner-sub,.eyebrow,.label,.mzs-hint,
.pf-stats span,.stat span,footer,.value,.tm-muted){
  color:var(--ui-text-muted)!important;-webkit-text-fill-color:var(--ui-text-muted)!important;
  text-transform:uppercase;letter-spacing:.08em;font-size:.72rem;font-weight:800;
}
html[data-theme-root] body .profile-name{background:transparent!important;border:0!important;box-shadow:none!important}
html[data-theme-root] body .profile-name>span:first-child{
  color:var(--ui-accent)!important;-webkit-text-fill-color:var(--ui-accent)!important;
}
html[data-theme-root] body :is(.mzs,.mzm){
  --sp:var(--ui-accent)!important;--sp-d:var(--ui-accent)!important;--sp-ink:var(--ui-ink)!important;
}
html[data-theme-root] body :is(.card,.tool-card,.email-card,.project,.skill):hover,
html[data-theme-root] body :is(button,.btn,.nav-btn):hover{
  transform:translate(-1px,-1px)!important;box-shadow:5px 5px 0 var(--ui-ink)!important;
}
html[data-theme-root] body :is(button,.btn,.nav-btn):active{
  transform:translate(2px,2px)!important;box-shadow:1px 1px 0 var(--ui-ink)!important;
}
html[data-theme-root] body :is(a,button,input,select,textarea,[role="button"]):focus-visible{
  outline:3px solid var(--ui-accent)!important;outline-offset:3px;
}
html[data-theme-root] body :is(button,input,select,textarea):disabled{
  opacity:.5;cursor:not-allowed;
}
.dark{color-scheme:dark}
@media (prefers-reduced-motion:reduce){
  html[data-theme-root] body *{scroll-behavior:auto!important;animation-duration:.01ms!important;
    animation-iteration-count:1!important;transition-duration:.01ms!important}
}
