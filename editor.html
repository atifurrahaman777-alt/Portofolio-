<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<title>Code Editor | Mann'zz Tools</title>
<link id="favicon" rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext x='32' y='43' font-family='Arial' font-weight='800' text-anchor='middle' font-size='25' fill='%230891b2'%3E%26lt;/%26gt;%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/show-hint.min.css">
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{--bg:#1a1b26;--card:#16161e;--line:#2a2b3d;--text:#c0caf5;--muted:#7a82a8;--accent:#7aa2f7;--on:#10131f;--err:#f7768e;--warn:#e0af68;--k:#bb9af7;--s:#9ece6a;--n:#ff9e64;--c:#565f89;--t:#7aa2f7;--a:#7dcfff;--d:#e0af68;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,sans-serif;display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
body.light-mode{--bg:#ffffff;--card:#f5f5f6;--line:#e4e4e7;--text:#111111;--muted:#6b7280;--accent:#2563eb;--on:#ffffff;--err:#dc2626;--warn:#b45309;--k:#7e22ce;--s:#15803d;--n:#b45309;--c:#6b7280;--t:#1d4ed8;--a:#0369a1;--d:#92400e}
button{font:inherit;color:inherit;cursor:pointer}
#bar{display:flex;align-items:stretch;background:var(--card);border-bottom:1px solid var(--line);flex:0 0 auto}
#bar>button{border:0;background:none;width:46px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
#bar svg{width:22px;height:22px}
#tabs{flex:1;display:flex;overflow-x:auto;min-width:0;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;display:flex;align-items:center;gap:4px;padding:0 4px 0 12px;border:0;border-bottom:2px solid transparent;background:none;color:var(--muted);max-width:180px}
.tab.on{color:var(--text);border-bottom-color:var(--accent);background:rgba(127,127,127,.1)}
.tab span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab img{width:16px;height:16px;flex:0 0 auto}
.tab i{font-style:normal;padding:8px;opacity:.7;font-size:16px}
#bar>#run{margin:5px 8px 5px 2px;width:36px;height:36px;border-radius:50%;background:#22c55e;color:#052e16}
#bar>#run svg{width:20px;height:20px}
#work{flex:1;min-height:0;display:flex;flex-direction:column}
#ed{flex:1;min-height:0;position:relative}
.CodeMirror{position:absolute;left:0;right:0;top:0;bottom:0;height:auto!important;background:var(--bg);color:var(--text);font:var(--fs,14px)/1.65 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.CodeMirror-gutters{background:var(--card);border-right:1px solid var(--line)}
.CodeMirror-linenumber{color:var(--muted)}
.CodeMirror-cursor{border-left:2px solid var(--text)}
.CodeMirror-selected{background:rgba(120,120,120,.35)!important}
.CodeMirror-activeline-background{background:rgba(127,127,127,.12)!important}
.CodeMirror-matchingbracket{color:var(--text)!important;background:rgba(120,120,120,.35)}
.cm-s-default .cm-keyword{color:var(--k)}
.cm-s-default .cm-string,.cm-s-default .cm-string-2{color:var(--s)}
.cm-s-default .cm-number,.cm-s-default .cm-atom{color:var(--n)}
.cm-s-default .cm-comment{color:var(--c);font-style:italic}
.cm-s-default .cm-tag{color:var(--t)}
.cm-s-default .cm-attribute,.cm-s-default .cm-property{color:var(--a)}
.cm-s-default .cm-def,.cm-s-default .cm-variable-2,.cm-s-default .cm-builtin,.cm-s-default .cm-qualifier,.cm-s-default .cm-type{color:var(--d)}
.cm-s-default .cm-variable,.cm-s-default .cm-bracket,.cm-s-default .cm-meta,.cm-s-default .cm-operator{color:var(--text)}
.stat{display:flex;justify-content:space-between;gap:12px;padding:5px 12px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);background:var(--card);white-space:nowrap;overflow-x:auto}
.keys{display:flex;gap:6px;padding:6px 8px;border-top:1px solid var(--line);overflow-x:auto;background:var(--card)}
.keys button{flex:0 0 auto;min-width:40px;height:36px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);font:500 15px ui-monospace,Menlo,monospace}
.keys button.sg{font:700 12px system-ui,sans-serif;background:var(--accent);color:var(--on);border-color:var(--accent)}
#out{flex:0 0 46%;display:flex;flex-direction:column;border-top:1px solid var(--line);background:var(--card);min-height:0}
#out.off{display:none}
#out.big{flex-basis:88%}
.oh{display:flex;align-items:center;gap:2px;padding:0 6px;border-bottom:1px solid var(--line);flex:0 0 auto}
.oh button{border:0;background:none;padding:9px 10px;color:var(--muted)}
.oh button.on{color:var(--text);box-shadow:inset 0 -2px var(--accent)}
.oh .sp{flex:1}
#con{flex:1;overflow:auto;font:12px/1.5 ui-monospace,Menlo,monospace;padding:6px 12px;min-height:0}
#frame{flex:1;width:100%;border:0;background:#fff;min-height:0}
.ln{padding:3px 0 3px 8px;border-left:3px solid var(--line);white-space:pre-wrap;word-break:break-word}
.ln.error{border-color:var(--err);color:var(--err)}
.ln.warn{border-color:var(--warn)}
.ln.info{border-color:var(--accent);color:var(--muted)}
#scrim{position:fixed;left:0;right:0;top:0;bottom:0;background:rgba(0,0,0,.5);z-index:35;display:none}
#scrim.on{display:block}
#side{position:fixed;left:0;top:0;bottom:0;width:min(84%,330px);background:var(--card);border-right:1px solid var(--line);transform:translateX(-103%);transition:transform .2s;z-index:40;display:flex;flex-direction:column}
#side.on{transform:none}
.sh{display:flex;align-items:center;gap:2px;padding:6px;border-bottom:1px solid var(--line)}
.sh b{flex:1;padding-left:8px}
.sh button{border:0;background:none;padding:8px 9px;border-radius:8px;font-size:13px}
#tree{flex:1;overflow:auto;padding:6px 0}
.row{display:flex;align-items:center;gap:8px;padding:9px 10px;border:0;background:none;width:100%;text-align:left}
.row.on{background:rgba(127,127,127,.15)}
.row .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .mo{padding:2px 8px;color:var(--muted);font-size:18px}
.row .ic{width:14px;text-align:center;font-size:11px;color:var(--muted);flex:0 0 auto}
.row img.ic{width:18px;height:18px;flex:0 0 auto}
.sf{display:flex;gap:4px;padding:6px;border-top:1px solid var(--line)}
.sf button{flex:1;border:1px solid var(--line);border-radius:8px;background:none;padding:9px 4px;font-size:12px}
.sheet{position:fixed;left:0;right:0;top:0;bottom:0;z-index:60;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet.off{display:none}
.panel{width:min(520px,100%);max-height:85%;overflow-y:auto;background:var(--card);border-radius:18px 18px 0 0;padding:16px;border:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.ph{display:flex;justify-content:space-between;align-items:center;font-size:1.05rem}
.ph button{background:none;border:0;color:var(--muted)}
.btn{padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-weight:700}
.btn.pri{background:var(--accent);color:var(--on);border-color:var(--accent)}
.btn.warn{border-color:var(--err);color:var(--err)}
.in{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit}
.CodeMirror-hints{background:var(--card)!important;color:var(--text)!important;border:1px solid var(--line)!important;border-radius:12px!important;font:14px ui-monospace,Menlo,monospace!important;max-height:34vh!important;padding:4px!important;box-shadow:0 8px 24px rgba(0,0,0,.45)!important;z-index:100!important}
.CodeMirror-hint{color:var(--text)!important;padding:9px 10px!important;border-radius:8px!important;max-width:92vw;white-space:pre!important;overflow:hidden;text-overflow:ellipsis}
li.CodeMirror-hint-active{background:var(--accent)!important;color:var(--on)!important}
</style>

</head>
<body>
<div id="bar">
  <button type="button" id="menu" aria-label="Berkas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  <div id="tabs"></div>
  <button type="button" id="run" aria-label="Jalankan"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button>
</div>
<div id="work">
  <div id="ed"></div>
  <div class="stat"><span id="stPos"></span><span id="stInfo"></span></div>
  <div class="keys" id="keys"></div>
</div>
<div id="out" class="off">
  <div class="oh"><button type="button" id="tCon" class="on">Konsol</button><button type="button" id="tPre">Pratinjau</button><span class="sp"></span><button type="button" id="oClr">Bersihkan</button><button type="button" id="oBig">&#10530;</button><button type="button" id="oX">&#10005;</button></div>
  <div id="con"></div>
  <iframe id="frame" sandbox="allow-scripts allow-modals allow-forms allow-popups" title="Pratinjau" style="display:none"></iframe>
</div>
<div id="scrim"></div>
<aside id="side">
  <div class="sh"><b>Proyek</b><button type="button" id="nf">+ File</button><button type="button" id="nd">+ Folder</button><button type="button" id="up">Unggah</button><button type="button" id="sx">&#10005;</button></div>
  <div id="tree"></div>
  <div class="sf"><button type="button" id="fm">A&minus;</button><button type="button" id="fp">A+</button><button type="button" id="thm">&#9680; Tema</button><button type="button" id="zip">ZIP</button></div>
</aside>
<input type="file" id="upin" multiple hidden>
<div class="sheet off" id="sheet"><div class="panel" id="panel"></div></div>
