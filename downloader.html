<script>

const form = document.getElementById('dl-form');
const urlInput = document.getElementById('dl-url');
const submitBtn = document.getElementById('dl-submit');
const loading = document.getElementById('dl-loading');
const errorBox = document.getElementById('dl-error');
const result = document.getElementById('dl-result');
const thumb = document.getElementById('dl-thumb');
const titleEl = document.getElementById('dl-title');
const metaEl = document.getElementById('dl-meta');
const linkEl = document.getElementById('dl-link');
const formatsEl = document.getElementById('dl-formats');

form.addEventListener('submit', async (e) => {
  e.preventDefault();

  const url = urlInput.value.trim();
  if (!url) return;

  errorBox.classList.remove('show');
  result.classList.remove('show');
  loading.classList.add('show');
  submitBtn.disabled = true;
  formatsEl.replaceChildren();

  try {
    const res = await fetch(
      `/api/download?url=${encodeURIComponent(url)}`,
      { cache: 'no-store' }
    );

    const raw = await res.text();
    let data;

    try {
      data = JSON.parse(raw);
    } catch {
      throw new Error('Respons server tidak valid.');
    }

    if (!res.ok || !data.success) {
      throw new Error(data.message || 'Gagal memproses link.');
    }

    const formats = Array.isArray(data.formats)
      ? data.formats.filter(f =>
          f && typeof f.downloadUrl === 'string' &&
          /^https?:\/\//i.test(f.downloadUrl)
        )
      : [];

    if (!formats.length && !data.downloadUrl) {
      throw new Error('Link download tidak ditemukan.');
    }

    if (data.thumbnail) {
      thumb.src = data.thumbnail;
      thumb.style.display = 'block';
    } else {
      thumb.removeAttribute('src');
      thumb.style.display = 'none';
    }

    titleEl.textContent = data.title || 'Media siap diunduh';
    metaEl.textContent = data.meta || 'OMDown';

    const items = formats.length
      ? formats
      : [{ downloadUrl: data.downloadUrl, quality: 'Download' }];

    items.forEach((f, i) => {
      const row = document.createElement('div');
      row.className = 'dl-format';

      const info = document.createElement('div');
      const name = document.createElement('strong');
      const detail = document.createElement('small');

      name.textContent =
        f.quality || f.label || f.resolution ||
        f.format || f.ext || `Format ${i + 1}`;

      detail.textContent = [
        f.ext,
        f.mimeType || f.contentType,
        f.size || ''
      ].filter(Boolean).join(' • ') || 'Media';

      info.append(name, document.createElement('br'), detail);

      const a = document.createElement('a');
      a.className = 'btn';
      a.href = f.downloadUrl;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.textContent = 'Unduh';

      row.append(info, a);
      formatsEl.appendChild(row);
    });

    linkEl.href = items[0].downloadUrl;
    result.classList.add('show');

  } catch (err) {
    errorBox.textContent = err.message || 'Terjadi kesalahan.';
    errorBox.classList.add('show');
  } finally {
    loading.classList.remove('show');
    submitBtn.disabled = false;
  }
});
</script>
